# CodeRabbit configuration — https://docs.coderabbit.ai/reference/configuration
# Free for public repositories; billed on CodeRabbit's own account (does NOT
# consume Anthropic/Claude usage). Reviews every PR automatically.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: chill # 'chill' = less noisy; switch to 'assertive' for stricter reviews
  # Keep false: a CodeRabbit APPROVE could satisfy main's required-1-approval
  # rule, which would gut the human merge gate on bestaxbot's PRs (issue #215).
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  # The convergence check (scripts/review-converged.mjs) reads the coderabbit
  # commit status on the PR head alongside the check runs, so a PR converges
  # only once CodeRabbit has reviewed the current SHA.
  commit_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    # 0 = never auto-pause (default pauses after 5 reviewed commits). A pause
    # is unrecoverable for bestaxbot, which never writes "@coderabbitai resume",
    # and would silently stall its PR. Runaway protection is the bot's own
    # round cap instead.
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - main

  # Repo-specific guidance so reviews match this monorepo's standards.
  path_instructions:
    - path: 'bulma-ui/**'
      instructions: >
        React 19 + TypeScript Bulma component library (@allxsmith/bestax-bulma).
        Enforce strict TypeScript types (no `any`), consistent prop naming, and
        accessibility (aria-* attributes, semantic elements). Every new or
        changed component should have a matching Storybook story and Jest tests;
        overall coverage must remain >= 99% for all metrics (the bulma-ui CI
        gate). Flag any change that would drop coverage below that, and flag
        missing tests/stories.
    - path: 'create-bestax/**'
      instructions: >
        CLI scaffolder that generates starter projects. Check template
        correctness (vite / vite-ts), generated file integrity, and Playwright
        e2e coverage for user-facing changes.
    - path: 'docs/**'
      instructions: >
        Docusaurus documentation site. Check MDX/Markdown correctness, working
        internal links, and that documented APIs match the library.
    - path: '.github/workflows/**'
      instructions: >
        Review the workflow logic normally. Their COMMENTS are reviewed for
        false claims about triggers, actors, or credentials only: do not
        request added qualifiers, counts, run ids, or dates in a comment;
        suggest deleting an overstated clause instead. Scripts and composite
        actions elsewhere under .github/ get ordinary correctness and security
        review.
    - path: '.github/CLAUDE.md'
      instructions: >
        The workflow security contract. Flag a claim that is false about
        triggers, actors, or credentials; do not request added qualifiers,
        counts, run ids, or dates.
    - path: '**/*.{ts,tsx}'
      instructions: >
        Follow the repo ESLint + Prettier config (Prettier 3.9.4). Prefer
        conventional-commit-friendly, focused changes.

  # Don't waste review effort on generated / lock / snapshot files.
  path_filters:
    - '!**/dist/**'
    - '!**/*.snap'
    - '!**/coverage/**'
    - '!**/storybook-static/**'
    - '!pnpm-lock.yaml'

chat:
  auto_reply: true

# Keep CodeRabbit's own summaries out of Claude's trigger path and reduce noise.
knowledge_base:
  learnings:
    scope: auto
