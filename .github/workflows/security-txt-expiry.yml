name: security.txt expiry

# Weekly reminder to renew docs/static/.well-known/security.txt before its
# `Expires` date passes (#414).
#
# RFC 9116 makes `Expires` mandatory, and an expired security.txt is worse than
# publishing none — scanners flag it rather than ignoring it. So the file
# carries a date somebody has to move, and this is what remembers to ask.
#
# Deliberately a reminder and NOT a CI gate. Failing the build the day the date
# passes would red whichever unrelated PR pushed next, which is the complaint
# #391 is about; the 30-day lead time is what makes a gate unnecessary. Nothing
# here can fail a build or block a merge.
#
# Idempotent: the issue body carries `<!-- security-txt-expiry -->` and an
# existing open issue with that marker is UPDATED rather than joined by a
# second one. A weekly cron that opened a fresh issue every run would be worse
# than no reminder, because the noise is what trains you to ignore it.
#
# Deliberately NOT gated on vars.AI_LOOP_ENABLED: this workflow uses zero
# Claude/AI — the script is plain REST calls — and zero-Claude workflows ignore
# the AI-spend kill switch (house rule, same as auto-close-duplicates.yml).

on:
  schedule:
    # 09:23 UTC Mondays — clear of the other crons in this repo
    # (02:00 and 06:37 daily; 07:41 and 08:17 Mondays).
    - cron: '23 9 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log what would happen without opening or updating an issue.'
        required: false
        type: boolean
        default: false
      warn-days:
        # The reason this input exists: the real trigger is a year away, so
        # without it the only proof the mechanism works is waiting a year and
        # finding out the hard way. Dispatch with something larger than the days
        # remaining (4000 comfortably covers a one-year Expires) and the run
        # fires immediately against the real API, creating the issue for real.
        # Dispatch a second time to watch it UPDATE that issue rather than open
        # a duplicate, which is the property worth seeing with your own eyes.
        #
        # Nothing to revert afterwards: this only widens the window for the one
        # manual run, the default stays 30, and the scheduled runs are
        # unaffected. Close the test issue when you are satisfied.
        description: 'Days before expiry to warn. Raise it (e.g. 4000) to force a real run now.'
        required: false
        type: string
        default: ''

# No workflow-level grants; the single job takes exactly what it needs.
permissions: {}

# One reminder at a time: a manual dispatch overlapping the weekly cron must
# not race a second creator over the same issue (the marker lookup and the
# create are not atomic, so two concurrent runs could both miss and both open).
concurrency:
  group: security-txt-expiry
  cancel-in-progress: false

jobs:
  check:
    name: Check security.txt expiry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open or update the renewal issue
      contents: read # checkout to read security.txt and run the script
    steps:
      # Rule 10: a new job ships at `block`, and since #487 that is an enforcing
      # control here rather than a declared intention — this job was already
      # observed arming `EgressPolicy:block` on run 31952287389, because
      # `schedule` and `workflow_dispatch` are outside the untrusted-trigger
      # class whose broken cache probe caused the fail-open. The assertion below
      # is what keeps that true rather than assumed.
      #
      # The list itself is still derived from what the steps below documentedly
      # reach rather than from a measured run; widen it from a StepSecurity
      # report if one is ever refused. Note the nearest sibling
      # (auto-close-duplicates.yml, also a scheduled issue-writer) carries no
      # harden-runner at all; it predates the rule and is tracked in #578 rather
      # than settled here.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443

      # Asserts the policy the pre-step decided (agent.json) AND that the agent
      # actually came up (agent.status, written only once the firewall rules are
      # installed). Either alone is a false pass: #487 was the first kind, and an
      # unresolvable host in this allowlist was the second, on this PR's own run.
      #
      # Scope it honestly: this proves enforcement was armed AT THIS STEP. It does
      # NOT prove the policy stays armed — the agent writes `Initialized` and then
      # serves, and a later runtime error makes it revert the firewall with both
      # files still reading exactly as they do here. Rule 10 in .github/CLAUDE.md
      # carries the mechanism and what to check when a session looks wrong.
      #
      # Linux-only paths (macOS uses /opt/step-security); all runners are ubuntu-latest.
      - name: Assert egress policy is enforced
        run: |
          set -uo pipefail
          # harden-runner has several deliberate "install nothing, exit 0" paths
          # (StepSecurity unavailable, the skip-harden-runner repo property, a
          # container or slim runner). None of them writes agent.json, so name
          # that case rather than leaving a bare jq "could not open file".
          if [ ! -e /home/agent/agent.json ]; then
            echo "::error::harden-runner installed no agent, so nothing is enforcing egress. Usual causes: a StepSecurity outage (its pre-step returns green without installing), the skip-harden-runner repo property, or a container/slim runner. This job holds a credential and will not run unprotected (#487)."
            exit 1
          fi
          if ! jq -e '.egress_policy == "block"' /home/agent/agent.json; then
            echo "::error::effective egress policy is not block — harden-runner downgraded it (#487)."
            exit 1
          fi
          # Poll rather than test once: the pre-step waits only for the file to
          # EXIST and gives up after ~9s, while the agent resolves every
          # allow-listed host before writing its status, so a cold resolver or a
          # long list can leave the file absent or still empty here.
          for _ in $(seq 1 30); do
            if grep -q '^Initialized' /home/agent/agent.status 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::agent.json reads block but the agent never reported Initialized — the firewall is not up. Check the agent log for 'Reverted changes' (usually an unresolvable allow-listed host)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No pnpm, no cache: the script is dependency-free (node: builtins +
      # global fetch), so plain Node 24 is all it needs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Open or update the renewal issue
        env:
          # GITHUB_TOKEN, not a PAT: issues opened with it do not emit workflow
          # events, so this cannot re-trigger the comment- and issue-driven
          # workflows in this repo (invariant I2).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          # Passed via env, never interpolated into the script body: this is
          # dispatch input, so it is attacker-chosen text on any repo where a
          # non-maintainer can dispatch. The script validates it and refuses
          # anything that is not a non-negative number.
          WARN_DAYS: ${{ inputs.warn-days }}
        run: |
          set -euo pipefail
          ARGS=(--repo="$REPO")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${WARN_DAYS:-}" ]; then
            ARGS+=(--warn-days="$WARN_DAYS")
          fi
          node scripts/check-security-txt-expiry.mjs "${ARGS[@]}"
