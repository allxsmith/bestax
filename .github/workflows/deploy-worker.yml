# Deploys telemetry-worker to Cloudflare Workers on every main-branch change
# under telemetry-worker/**, mirroring the Pages deploy in deploy.yml: build
# happens here (wrangler bundles src/index.ts), Cloudflare only receives the
# artifact. workflow_dispatch allows a manual redeploy from the Actions tab.
#
# The only credential in this job is CLOUDFLARE_WORKERS_DEPLOY_TOKEN, an API
# token scoped to Workers Scripts:Edit + Workers Routes:Edit on bestax.io —
# deliberately separate from CLOUDFLARE_API_TOKEN (Pages) so each pipeline
# holds only what it deploys.
name: Deploy telemetry worker

on:
  push:
    branches:
      - main
    paths:
      - 'telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: two quick main pushes must not race — an older run
# finishing last would ship stale worker code. No cancel-in-progress: a
# deploy already uploading should finish, then the newer one runs.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      # Rule 10 (.github/CLAUDE.md): new jobs ship with egress-policy: block —
      # this is the job holding the Cloudflare deploy token. Endpoints:
      # checkout (github.com trio), wrangler install (npm registry), and the
      # upload itself (api.cloudflare.com). Wrangler's own metrics beacon is
      # disabled below instead of allow-listing its host.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No later step needs authenticated git; don't leave the token in
          # the local git config for the rest of the job.
          persist-credentials: false

      # No pnpm/Node setup: the worker is stdlib-only TypeScript with no build
      # step of its own — wrangler-action installs the pinned wrangler and its
      # bundler does the rest.
      - name: Deploy with wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telemetry-worker
          wranglerVersion: '4.124.0'
          command: deploy
