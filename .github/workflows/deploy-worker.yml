# Deploys telemetry-worker to Cloudflare Workers on every main-branch change
# under telemetry-worker/**, mirroring the Pages deploy in deploy.yml: build
# happens here (wrangler bundles src/index.ts), Cloudflare only receives the
# artifact. workflow_dispatch allows a manual redeploy from the Actions tab.
#
# The only credential in this job is CLOUDFLARE_WORKERS_DEPLOY_TOKEN, an API
# token scoped to Workers Scripts:Edit + Workers Routes:Edit on bestax.io —
# deliberately separate from CLOUDFLARE_API_TOKEN (Pages) so each pipeline
# holds only what it deploys.
name: Deploy telemetry worker

on:
  push:
    branches:
      - main
    paths:
      - 'telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: two quick main pushes must not race — an older run
# finishing last would ship stale worker code. No cancel-in-progress: a
# deploy already uploading should finish, then the newer one runs.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      # Rule 10 (.github/CLAUDE.md): new jobs ship with egress-policy: block —
      # this is the job holding the Cloudflare deploy token. Endpoints:
      # checkout (github.com trio), the pnpm/node toolchain (npm registry,
      # nodejs.org + release assets for a toolcache miss), and the upload
      # itself (api.cloudflare.com). Wrangler's own metrics beacon is disabled
      # below instead of allow-listing its host. No actions-cache endpoints on
      # purpose: setup-node runs cache-less here to keep this list short.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      # Asserts the policy the pre-step decided (agent.json) AND that the agent
      # actually came up (agent.status, written only once the firewall rules are
      # installed). Either alone is a false pass: #487 was the first kind, and an
      # unresolvable host in this allowlist was the second, on this PR's own run.
      #
      # Scope it honestly: this proves enforcement was armed AT THIS STEP. It does
      # NOT prove the policy stays armed — the agent writes `Initialized` and then
      # serves, and a later runtime error makes it revert the firewall with both
      # files still reading exactly as they do here. Rule 10 in .github/CLAUDE.md
      # carries the mechanism and what to check when a session looks wrong.
      #
      # Linux-only paths (macOS uses /opt/step-security); all runners are ubuntu-latest.
      - name: Assert egress policy is enforced
        run: |
          set -uo pipefail
          # harden-runner has several deliberate "install nothing, exit 0" paths
          # (StepSecurity unavailable, the skip-harden-runner repo property, a
          # container or slim runner). None of them writes agent.json, so name
          # that case rather than leaving a bare jq "could not open file".
          if [ ! -e /home/agent/agent.json ]; then
            echo "::error::harden-runner installed no agent, so nothing is enforcing egress. Usual causes: a StepSecurity outage (its pre-step returns green without installing), the skip-harden-runner repo property, or a container/slim runner. This job holds a credential and will not run unprotected (#487)."
            exit 1
          fi
          if ! jq -e '.egress_policy == "block"' /home/agent/agent.json; then
            echo "::error::effective egress policy is not block — harden-runner downgraded it (#487)."
            exit 1
          fi
          # Poll rather than test once: the pre-step waits only for the file to
          # EXIST and gives up after ~9s, while the agent resolves every
          # allow-listed host before writing its status, so a cold resolver or a
          # long list can leave the file absent or still empty here.
          for _ in $(seq 1 30); do
            if grep -q '^Initialized' /home/agent/agent.status 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::agent.json reads block but the agent never reported Initialized — the firewall is not up. Check the agent log for 'Reverted changes' (usually an unresolvable allow-listed host)."
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No later step needs authenticated git; don't leave the token in
          # the local git config for the rest of the job.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Wrangler comes from the workspace lockfile — the same pinned version,
      # cooldown, audit, and blocked-install-script policy that governs every
      # other dependency. wrangler-action would instead `npm i` its own copy
      # at deploy time, resolving wrangler's transitive ranges fresh and
      # outside all of those controls.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm --filter telemetry-worker exec wrangler deploy
