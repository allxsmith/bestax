# Deploys telemetry-worker to Cloudflare Workers on every main-branch change
# under telemetry-worker/**, mirroring the Pages deploy in deploy.yml: build
# happens here (wrangler bundles src/index.ts), Cloudflare only receives the
# artifact. workflow_dispatch allows a manual redeploy from the Actions tab.
#
# The only credential in this job is CLOUDFLARE_WORKERS_DEPLOY_TOKEN, an API
# token scoped to Workers Scripts:Edit + Workers Routes:Edit on bestax.io —
# deliberately separate from CLOUDFLARE_API_TOKEN (Pages) so each pipeline
# holds only what it deploys.
name: Deploy telemetry worker

on:
  push:
    branches:
      - main
    paths:
      - 'telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: two quick main pushes must not race — an older run
# finishing last would ship stale worker code. No cancel-in-progress: a
# deploy already uploading should finish, then the newer one runs.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      # Rule 10 (.github/CLAUDE.md): new jobs ship with egress-policy: block —
      # this is the job holding the Cloudflare deploy token. Endpoints:
      # checkout (github.com trio), the pnpm/node toolchain (npm registry,
      # nodejs.org + release assets for a toolcache miss), and the upload
      # itself (api.cloudflare.com). Wrangler's own metrics beacon is disabled
      # below instead of allow-listing its host. No actions-cache endpoints on
      # purpose: setup-node runs cache-less here to keep this list short.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloudflare.com:443
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      # Two assertions, because either one alone is a false pass.
      #
      # agent.json holds the policy the pre-step DECIDED, serialized after every
      # policy decision it makes — so it catches a downgrade, which is what #487
      # was: `block` silently meaning `audit` for two months, announced by a
      # single core.info line.
      #
      # agent.status is written only once the firewall rules are installed. It is
      # needed because agent.json is written BEFORE the agent starts: if the agent
      # then fails to come up, the pre-step logs `timed out`, reverts its changes
      # and still exits 0 — leaving `block` in agent.json and no firewall at all.
      # Not hypothetical: it happened on this PR, caused by an unresolvable host
      # in this very allowlist.
      #
      # A missing file, the wrong policy, or an agent that never initialized all
      # fail the job. Linux-only paths (macOS uses /opt/step-security); every
      # runner here is ubuntu-latest.
      - name: Assert egress policy is enforced
        run: |
          jq -e '.egress_policy == "block"' /home/agent/agent.json
          grep -qx Initialized /home/agent/agent.status

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No later step needs authenticated git; don't leave the token in
          # the local git config for the rest of the job.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Wrangler comes from the workspace lockfile — the same pinned version,
      # cooldown, audit, and blocked-install-script policy that governs every
      # other dependency. wrangler-action would instead `npm i` its own copy
      # at deploy time, resolving wrangler's transitive ranges fresh and
      # outside all of those controls.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm --filter telemetry-worker exec wrangler deploy
