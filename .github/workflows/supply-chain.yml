name: Supply Chain Evidence

# Produces the artifacts enterprise consumers ask for and that the rest of our
# posture only *claims*: a machine-readable SBOM per release, and an
# independent check that what we actually published to npm carries valid
# registry signatures and provenance attestations.
#
# Deliberately NOT wired into ci.yml's publish job: nothing here may be able to
# fail a release. It runs after the release exists, on a schedule, or on demand.
on:
  release:
    types: [published]
  schedule:
    # Mondays 08:17 UTC, offset from the Scorecard run.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Generation is read-only. It runs `pnpm install` and third-party actions, so
  # it must never hold a write-scoped token — a compromised dependency or
  # action would inherit it. The release upload is split into its own job below.
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      # NOTE ON SCOPE: this produces a *repository* SBOM — the full monorepo
      # dev toolchain (storybook, playwright, docusaurus, jest, turbo…) as
      # resolved by the lockfile CI builds from. It is deliberately NOT the
      # published-package dependency closure, which for bestax-bulma is just
      # Bulma. Useful for auditing what builds our releases; do not read it as
      # "what a consumer installs". The per-package consumer closures are the
      # next job in this file (#424).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: bestax-sbom.spdx.json
          output-file: bestax-sbom.spdx.json
          # Defaults to true: the action would upload its own release asset on
          # a release event, racing the explicit upload below and naming files
          # by its own convention. Keep one deterministic uploader.
          upload-release-assets: false

      # Both formats on purpose: SPDX is the ISO standard procurement asks for,
      # CycloneDX is what most scanning tools ingest natively.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: bestax-sbom.cdx.json
          output-file: bestax-sbom.cdx.json
          upload-release-assets: false

  # The job above answers "what builds their releases". This one answers the
  # question procurement actually asks — "what enters my dependency tree if I
  # install this?" — which is a different and much smaller set (#424).
  #
  # How much smaller, measured rather than asserted — read out of the documents
  # produced by run 33260691933 (2026-08-29), not carried forward:
  #
  #   @allxsmith/bestax-bulma   5 packages   (7 entries shipped)
  #   create-bestax            12             (14)
  #   bestax-migrate           98             (100)
  #   bestax-mcp               93             (95)
  #
  # The first column is the closure; the second is what the document actually
  # contains, because the scan adds two entries that are not dependencies: the
  # scratch project the lockfile records as its root, and the configured source
  # syft emits as a package. Both are named so a reader can tell what they are,
  # and check-consumer-sbom.mjs exempts them by those exact names. Stated in
  # both columns because a procurement reader counts entries in the SBOM, not
  # in this comment.
  #
  # These are LIVE REGISTRY closures and they drift whenever any transitive
  # dependency publishes, so treat them as a scale, not a checksum — bestax-mcp
  # read 94 here until it was re-measured, against 95 entries it could never
  # have been consistent with. Nothing enforces them, deliberately: pinning
  # counts as a gate is what 48c57d5 reverted. Re-measure from a dispatch when
  # touching this job rather than editing the numbers to taste.
  #
  # Compare against a repository SBOM covering the whole dev toolchain: reading
  # the repo SBOM as a consumer closure overstates our footprint by about two
  # orders of magnitude, and obscures a genuinely tiny runtime closure that is
  # a selling point.
  #
  # Per package, not one combined tree. Installing all four together resolves to
  # 204 packages, which would bury bulma-ui's five-package closure under the
  # CLIs' dependencies and reproduce the exact problem this job exists to fix.
  #
  # Generation only, like `sbom`. Stated precisely: this job does hold a
  # credential — `contents: read` grants a read-scoped GITHUB_TOKEN, and
  # sbom-action defaults its `github-token` input to it. The guarantee is that
  # it holds no WRITE-scoped credential; the write-scoped upload stays confined
  # to `attach-sbom` (#411's split, and an explicit acceptance criterion of
  # #424). Saying "no credential" would overstate the boundary.
  consumer-sbom:
    name: Consumer SBOM (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One package failing must not hide the other three. They are independent
      # documents; there is nothing to be gained by cancelling the siblings.
      fail-fast: false
      matrix:
        include:
          - package: '@allxsmith/bestax-bulma'
            slug: allxsmith-bestax-bulma
          - package: create-bestax
            slug: create-bestax
          - package: bestax-migrate
            slug: bestax-migrate
          - package: bestax-mcp
            slug: bestax-mcp

    steps:
      # Rule 10: a new job ships at `block`. This file has five jobs; the three
      # that carry no harden-runner (`sbom`, `attach-sbom`, `verify-provenance`)
      # predate the rule and are grandfathered by its "existing live job" clause.
      # This one and `sign-sbom` are not, and both enforce.
      #
      # Egress-block IS an enforced control on this job, and the step after
      # harden-runner asserts it rather than leaving it to inference. The
      # observation this comment used to record as a bare datapoint is now the
      # documented behaviour: run 32088629752 (a workflow_dispatch) reported
      # `EgressPolicy:block` and refused a connection — `domain not allowed:
      # raw.githubusercontent.com` — failing the job with ECONNREFUSED. #487's
      # root cause was the Actions cache going read-only for *untrusted*
      # triggers; this job runs on release, schedule and dispatch, none of which
      # are in that class, so the probe succeeded here even before v2.21.0
      # removed the fail-open entirely.
      #
      # The list below is measured, not guessed: raw.githubusercontent
      # .com is here because sbom-action fetches syft's install script from it,
      # which no amount of reading the action would have made obvious. The cache
      # host (productionresultssa12.blob.core.windows.net) is absent on purpose
      # — harden-runner's probe discovers and adds it itself, as the sign-sbom
      # comment already claimed and this run confirms.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            raw.githubusercontent.com:443

      # Asserts the policy the pre-step decided (agent.json) AND that the agent
      # actually came up (agent.status, written only once the firewall rules are
      # installed). Either alone is a false pass: #487 was the first kind, and an
      # unresolvable host in this allowlist was the second, on this PR's own run.
      #
      # Scope it honestly: this proves enforcement was armed AT THIS STEP. It does
      # NOT prove the policy stays armed — the agent writes `Initialized` and then
      # serves, and a later runtime error makes it revert the firewall with both
      # files still reading exactly as they do here. Rule 10 in .github/CLAUDE.md
      # carries the mechanism and what to check when a session looks wrong.
      #
      # Runs once per matrix leg. Linux-only paths (macOS uses /opt/step-security);
      # all runners are ubuntu-latest.
      - name: Assert egress policy is enforced
        run: |
          set -uo pipefail
          # harden-runner has several deliberate "install nothing, exit 0" paths
          # (StepSecurity unavailable, the skip-harden-runner repo property, a
          # container or slim runner). None of them writes agent.json, so name
          # that case rather than leaving a bare jq "could not open file".
          if [ ! -e /home/agent/agent.json ]; then
            echo "::error::harden-runner installed no agent, so nothing is enforcing egress. Usual causes: a StepSecurity outage (its pre-step returns green without installing), the skip-harden-runner repo property, or a container/slim runner. This job holds a credential and will not run unprotected (#487)."
            exit 1
          fi
          if ! jq -e '.egress_policy == "block"' /home/agent/agent.json; then
            echo "::error::effective egress policy is not block — harden-runner downgraded it (#487)."
            exit 1
          fi
          # Poll rather than test once: the pre-step waits only for the file to
          # EXIST and gives up after ~9s, while the agent resolves every
          # allow-listed host before writing its status, so a cold resolver or a
          # long list can leave the file absent or still empty here.
          for _ in $(seq 1 30); do
            if grep -q '^Initialized' /home/agent/agent.status 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::agent.json reads block but the agent never reported Initialized — the firewall is not up. Check the agent log for 'Reverted changes' (usually an unresolvable allow-listed host)."
          exit 1

      # New in #530: this job now runs two scripts from scripts/, per rule 9 —
      # the install/stamp logic and the closure guard — so it needs the
      # repository on disk. That adds a third-party action to a job that had
      # none, which is the honest cost rather than something to elide: it is on
      # the repo-wide pin (rule 1) and `persist-credentials: false` means no
      # token reaches the runner's git config. The job's `allowed-endpoints`
      # needs no change — checkout reaches github.com, api.github.com and
      # objects.githubusercontent.com, all already listed above.
      #
      # The EVENT ref, deliberately, and NOT `ref: main` as `verify-provenance`
      # uses. That job reads a verifier which must not come from the tag it is
      # verifying; this one asserts a property of a document THIS JOB JUST
      # GENERATED, so there is no third party whose claim the checked-out code
      # could be made to rubber-stamp. The reasoning does not transfer.
      #
      # It also matters practically: this job is only ever exercised by a
      # `workflow_dispatch` on a branch (it never runs on a PR), and pinning to
      # `main` would read the guard from `main` — which, for the PR introducing
      # it, does not have one. That is rule 9's bootstrap gap, and here it would
      # make the change unverifiable by the only means available.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # nodejs.org is in the list above because `setup-node` falls back to
      # downloading from nodejs.org/dist when the runner's tool cache misses the
      # requested version — exactly the kind of host a guessed allowlist omits.
      #
      # raw.githubusercontent.com deserves its own note, because it is the
      # widest entry here and the surrounding comments should not imply
      # otherwise. sbom-action fetches syft's installer from
      # `raw.githubusercontent.com/anchore/syft/main/install.sh` — a MUTABLE
      # ref. So the action being SHA-pinned (rule 1) does not cover the shell
      # that actually runs, and SECURITY.md advertises SHA pinning as an active
      # control. The host is also not tight: raw.githubusercontent.com serves
      # content from every public repository on GitHub, which is the same
      # objection the sign-sbom comment raises against `*.blob.core.windows.net`
      # — narrower, but the same kind. Both facts are here so the next reader
      # does not have to rediscover them.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # npm, not pnpm: this has to resolve the way a consumer's install does,
      # and the resulting package-lock.json is deliberately left in place for
      # Syft to read.
      #
      # An earlier draft installed with `--omit=peer` and deleted the lockfile
      # before scanning, to publish only "what we add" — three packages for
      # bulma-ui instead of five. That was wrong on every axis, which is worth
      # recording so nobody reintroduces it:
      #
      #   - The lockfile is the only source of `resolved` registry URLs, and
      #     those DO survive: syft maps NpmPackageLockEntry.Resolved to SPDX
      #     `downloadLocation`, so each entry records where its tarball came
      #     from. A node_modules-only scan cannot say that.
      #
      #     Note what does NOT survive, because an earlier version of this
      #     comment claimed it did: the lockfile's `integrity` digests are
      #     dropped. syft's SPDX exporter populates package checksums for
      #     Java archives, Go build info and OPAM only (toPackageChecksums in
      #     spdxhelpers/to_format_model.go), with no npm case. Keeping the
      #     lockfile does not buy verifiable digests. Do not re-add that claim
      #     without checking that exporter again.
      #   - The lockfile is not misleading about peers: it marks them
      #     `"peer": true`, recording "resolved, not installed here" — strictly
      #     richer than the physical tree.
      #   - npm hoists `scheduler` into node_modules even when react-dom is
      #     omitted, so the on-disk tree implies a dependency nothing installed
      #     actually requires.
      #   - Deleting an input so a scanner produces a preferred answer is
      #     shaping the evidence, in a document whose entire purpose is being
      #     evidence.
      #
      # The point of #424 is already carried by scanning a consumer tree at all:
      # five packages for bulma-ui against the whole dev toolchain. Trading
      # away digests to reach three was a bad bargain.
      #
      # `--omit=optional` is deliberately NOT used either. It would cut
      # bestax-migrate from 98 packages to 57, but consumers really do get
      # optional dependencies, and an SBOM that omits them understates the tree.
      # `--ignore-scripts` is a deliberate divergence from a real consumer's
      # install, not an oversight. It matches this repository's standing posture
      # (pnpm-workspace.yaml blocks install scripts by default) and means this
      # job never executes arbitrary published code.
      #
      # It does change what the document describes, and the honest framing is:
      # this SBOM is npm's RESOLVED closure, before any post-install mutation.
      # A lifecycle script can invoke a package manager and alter node_modules
      # or the lockfile, so "scripts cannot affect the inventory" would be too
      # strong a claim.
      #
      # The scratch project is named and marked private rather than left to
      # `npm init -y`, which names it after the directory. That default puts a
      # package called `consumer@1.0.0`, license ISC, at the root of the
      # lockfile — and therefore into a published SBOM, describing something
      # that exists nowhere. Naming it for what it is makes the root entry
      # self-evidently the scan container instead of a phantom dependency.
      #
      # WHICH VERSION gets installed is decided by consumer-sbom-meta.mjs
      # (#530 item 1), not by resolving `latest` for all four legs as this
      # step used to.
      #
      # For the ONE package a release names, `release.tag_name` is `<pkg>@X.Y.Z`
      # (VERSIONING.md, and the `tagFormat` in each release.config.js), so the
      # exact version is available and is pinned. Two failure modes that fixes,
      # both real rather than theoretical:
      #
      #   - `release: published` fires immediately after `npm publish`, so a
      #     CDN-cached packument could resolve the PREVIOUS version and stamp
      #     release 5.12.0 with an SBOM describing 5.11.1.
      #   - A re-run days later resolved a newer `latest` and produced a
      #     different filename, which `gh release upload --clobber` cannot
      #     replace — leaving the release permanently carrying two
      #     contradictory consumer SBOMs for the same package.
      #
      # The other three legs necessarily stay on `latest`: a release says
      # nothing about them, and a consumer SBOM describes what a consumer
      # installs today. That asymmetry is why the decision is a script with a
      # test rather than an expression here — the tag has to be matched to its
      # matrix leg, and only that leg pinned.
      #
      # The read-back and its validation moved to the same script (rule 9).
      # The validation is the reason: it guards a value that comes out of a
      # published tarball — the one input here an attacker would control if a
      # package were compromised — and that value flows into $GITHUB_OUTPUT and
      # into the syft config heredoc below, where a newline would define
      # arbitrary extra step outputs and inject config keys. That is logic worth
      # testing, and it could not be tested where it lived.
      #
      # `--expect` is new leverage the pin buys: when a version was asked for,
      # the tree must carry it, or the job fails rather than quietly describing
      # a different release than the one it is attached to.
      - name: Decide which version to install
        id: spec
        env:
          PACKAGE: ${{ matrix.package }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        # Writes `spec` and `expect` itself. `expect` is empty for the three
        # legs no release names, and the workflow does no parsing of its own —
        # deriving the version from the spec here would reimplement the
        # last-`@` split in untested YAML, one character from being wrong for
        # the one scoped package.
        run: |
          node scripts/consumer-sbom-meta.mjs spec \
            --package "$PACKAGE" --event "$EVENT" --tag "$TAG"

      - name: Install the published package as a consumer would
        id: install
        env:
          PACKAGE: ${{ matrix.package }}
          SLUG: ${{ matrix.slug }}
          SPEC: ${{ steps.spec.outputs.spec }}
          EXPECT: ${{ steps.spec.outputs.expect }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > package.json <<JSON
          {
            "name": "bestax-consumer-closure-$SLUG",
            "version": "0.0.0",
            "private": true,
            "description": "Scan container: the installed closure of $PACKAGE"
          }
          JSON

          # Retried, and only because of the pin. Resolving `latest` always had
          # SOMETHING to resolve; asking for an exact version seconds after
          # `npm publish` can 404 while the packument propagates. Without this,
          # item 1 would trade "the SBOM names the wrong version" for "the
          # released package has no SBOM at all", which is a worse deal — the
          # released leg is the one the release actually cares about.
          for attempt in 1 2 3; do
            if npm install --ignore-scripts "$SPEC"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::npm install $SPEC failed three times"
              exit 1
            fi
            echo "npm install $SPEC failed (attempt $attempt); retrying"
            sleep $((attempt * 10))
          done

          # A scan directory holding ONLY the lockfile (#530 item 5). syft used
          # to be pointed at the consumer tree and recursively walked every file
          # under node_modules — thousands of them for bestax-migrate's
          # 98-package closure, twice per matrix leg — to satisfy a cataloger
          # that reads the root lockfile and nothing else.
          #
          # A copied directory rather than the lockfile itself, and that is not
          # fussiness. Passing the lockfile as sbom-action's `file` input DOES
          # work and DOES remove the walk, but it changes the source type, and a
          # file source made syft emit the scanned file as a component of its
          # own: every CycloneDX document came out carrying
          # `/home/runner/work/_temp/consumer/package-lock.json`. That is the
          # exact runner-path leak #529 fixed for SPDX, reintroduced in the
          # other format. Scanning a directory keeps the document shape #529
          # measured and validated; the directory just has nothing else in it.
          mkdir -p "$RUNNER_TEMP/scan"
          cp package-lock.json "$RUNNER_TEMP/scan/package-lock.json"

          cd "$GITHUB_WORKSPACE"
          if [ -n "$EXPECT" ]; then
            node scripts/consumer-sbom-meta.mjs stamp \
              --package "$PACKAGE" --slug "$SLUG" \
              --dir "$RUNNER_TEMP/consumer" --expect "$EXPECT"
          else
            node scripts/consumer-sbom-meta.mjs stamp \
              --package "$PACKAGE" --slug "$SLUG" \
              --dir "$RUNNER_TEMP/consumer"
          fi

      # Three problems the first real run surfaced, all fixed by one syft
      # config. None were visible without reading a generated document — which
      # is the argument for dispatching and reading it rather than trusting a
      # green job.
      #
      # 1. `default-catalogers: javascript-lock-cataloger` — one cataloger, and
      #    the narrowness is the point. Two problems, found one after the other:
      #
      #    syft's github-actions cataloger was picking up `.github/workflows`
      #    YAML that some upstream packages ship inside their npm tarballs, so
      #    the SBOM listed `actions/checkout@v4` and `actions/setup-node@v4` as
      #    if they were dependencies — bestax-migrate at 111 entries against a
      #    real closure of 98.
      #
      #    Selecting the whole `javascript` group fixed that and broke something
      #    worse: it enables BOTH javascript catalogers, so every package was
      #    listed twice — once from its node_modules/package.json and once from
      #    the lockfile, taking bestax-migrate to 200. The lock cataloger alone
      #    is what we want: it sees every package (the lockfile is complete) and
      #    it is the one carrying `resolved`, which is the registry URL that
      #    ends up as SPDX downloadLocation.
      #
      # 2. `source.name` — every document was named
      #    `/home/runner/work/_temp/consumer`, identical across all four, so the
      #    artifact leaked the runner's filesystem layout and did not say which
      #    package it described. It also appeared as a package entry with a null
      #    version.
      #
      #    The `consumer-closure:` prefix is deliberate. Syft emits the
      #    configured source as its own SPDX package, so naming it plainly after
      #    the target made the target appear TWICE — once from the lock
      #    cataloger with its registry URL, once as the source with
      #    NOASSERTION. Seven entries for a five-package closure. The prefix
      #    keeps the document self-identifying while ensuring every actual
      #    closure package appears exactly once.
      #
      # 3. `source.version` — pairs with the above so the document states the
      #    version it documents, not just the filename.
      - name: Configure syft
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.install.outputs.version }}
        run: |
          # NO BACKTICKS BELOW THIS LINE. The heredoc is unquoted, because it
          # interpolates $PACKAGE and $VERSION, so backticks are command
          # substitution rather than punctuation. Until #530 the comment about
          # yarn.lock said "a files: field" in backticks and the runner
          # cheerfully executed 'files:' and pasted the empty result — the
          # generated config read "publishing without  field". Harmless inside
          # a YAML comment, but the next phrase somebody backticks might not be.
          cat > "$RUNNER_TEMP/syft.yaml" <<YAML
          default-catalogers:
            - javascript-lock-cataloger
          # The lock cataloger globs **/package-lock.json, **/yarn.lock and
          # **/pnpm-lock.yaml, so a directory scan also reads lockfiles that
          # dependencies ship inside their own tarballs. npm always excludes
          # package-lock.json from a tarball but NOT yarn.lock, so one dep
          # publishing without a files: field would inject its entire dev
          # closure into this document. That was the third instance of this
          # failure class on #529's branch, after the github-actions cataloger
          # and the javascript group.
          #
          # As of #530 item 5 the scan directory holds only a copy of the
          # lockfile, so this exclusion is STRUCTURALLY unnecessary rather than
          # merely correct — there is no node_modules under it to walk. It
          # stays because it costs nothing and because the failure class above
          # is worth keeping written down next to the thing that closes it.
          exclude:
            - './node_modules/**'
          # No file cataloging. Not an optimisation — it closes a leak that has
          # been shipping since #529, and that the guard below caught on its
          # first run reading CycloneDX.
          #
          # File metadata is cataloged independently of default-catalogers,
          # which is why restricting that to the lock cataloger did not stop
          # it. syft emitted the scanned lockfile as an artifact in its own
          # right, and the two exporters disagreed about how to name it: SPDX
          # put a RELATIVE package-lock.json in its files array, while
          # CycloneDX put a type: file component named with the ABSOLUTE path.
          # So every published .cdx.json carried
          # /home/runner/work/_temp/consumer/package-lock.json — the same
          # runner-path leak #529 fixed for SPDX, in the format nobody read.
          #
          # Pre-existing, not introduced here: confirmed against run
          # 32706731377, a scheduled run on main from before this branch.
          #
          # Nothing is lost. The file entry describes the scan container, not
          # the closure; the evidence this document exists to carry is the
          # package list and its registry URLs.
          file:
            metadata:
              selection: none
          source:
            name: "consumer-closure:$PACKAGE"
            version: "$VERSION"
          YAML
          cat "$RUNNER_TEMP/syft.yaml"

      # `path` is the lockfile-only scan directory built in the install step,
      # not the consumer tree (#530 item 5) — see that step for why it is a
      # copied directory rather than the lockfile itself.
      #
      # Two dead ends this cost two dispatches to rule out, recorded so nobody
      # re-walks them:
      #   - `path: …/package-lock.json` fails outright. sbom-action prefixes
      #     whatever `path` receives with syft's `dir:` scheme, so a file
      #     produces `not a directory source` on every matrix leg.
      #   - `file: …/package-lock.json` works and is the input built for it,
      #     but a file source makes syft emit the scanned file as a component,
      #     putting the runner's absolute path into every CycloneDX document.
      #
      # `output-file` comes from one step output rather than being spelled out
      # four times (#530 item 4). `sign-sbom` and `attach-sbom` still glob these
      # names from their own jobs and cannot read a step output across a job
      # boundary — what keeps those globs honest is that the prefix is a single
      # exported constant (ARTIFACT_PREFIX in scripts/consumer-sbom-meta.mjs)
      # pinned by a test.
      #
      # `upload-artifact: false` on BOTH, with one explicit upload after the
      # guard. This is what makes the guard a GATE rather than a detector, and
      # the distinction is not academic: the action generates and uploads in a
      # single step, so with its default the artifact existed before anything
      # had looked at it — and `sign-sbom`/`attach-sbom` deliberately do not
      # require `consumer-sbom` to have succeeded, so on a real release they
      # would download that artifact by glob and sign and permanently attach a
      # document the guard had already rejected. The run went red and the bad
      # SBOM shipped anyway.
      #
      # Deferring the upload preserves the degradation #529 designed for: a leg
      # that fails, for any reason, simply produces no artifact, the globs
      # downstream expand to nothing, and `attach-sbom` emits its ::warning::
      # while the repository SBOMs still ship.
      - name: Generate SPDX consumer SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/scan
          format: spdx-json
          config: ${{ runner.temp }}/syft.yaml
          output-file: ${{ steps.install.outputs.basename }}.spdx.json
          upload-artifact: false
          # Same reason as the repository SBOM: one deterministic uploader.
          upload-release-assets: false

      - name: Generate CycloneDX consumer SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/scan
          format: cyclonedx-json
          config: ${{ runner.temp }}/syft.yaml
          output-file: ${{ steps.install.outputs.basename }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # The guard #529 deferred (#530 item 2). Nothing asserted anything about
      # the generated document, so a syft, cataloger or exporter change — or a
      # dependency that starts shipping a lockfile — shipped silently green.
      # Every defect #529 fixed was found by dispatching this workflow and
      # reading the JSON, never by a green job; this is that read, automated.
      #
      # Deliberately NOT a count. The first attempt compared `!==` against
      # counts hardcoded in the matrix (5/12/98/94) and was reverted in
      # 48c57d5: those are live registry closures that drift whenever any
      # transitive dependency publishes, so the job would go red on somebody
      # else's release having found nothing wrong — the cry-wolf failure this
      # repository has already fixed twice (#391, #525).
      #
      # What it asserts instead: that every catalogued entry came from the npm
      # registry, that the package the document names is in it at the stamped
      # version and its subject agrees, a floor, and that the two documents
      # list the same closure. None knows a count, so growth never reds this.
      # Rule 9: the logic and its reasoning live in
      # scripts/check-consumer-sbom.mjs with a node --test sibling that
      # replays every regression this job has actually had.
      #
      # The registry claim is carried very unequally by the two formats, and
      # the script says so at length rather than implying parity. SPDX maps the
      # lockfile's `resolved` to downloadLocation, so it is real provenance.
      # CycloneDX builds `pkg:npm/name@version` from the name and version and
      # records `resolved` nowhere at all, so there it is only an ECOSYSTEM
      # test — enough to catch a github-actions entry or a bare file component,
      # not a git or tarball dependency. The same-closure assertion is what
      # closes that gap: anything the weaker test would admit must also appear
      # in SPDX, where the strong one is waiting.
      #
      # BOTH documents, not just SPDX, and that is not belt-and-braces. They
      # come from two separate sbom-action invocations, and an SPDX-only guard
      # demonstrably passes a broken CycloneDX one: every published .cdx.json
      # since #529 carried `/home/runner/work/_temp/consumer/package-lock.json`
      # while every .spdx.json checked out clean (run 32706731377, a scheduled
      # run on main). Both get signed and attached, so both get read.
      #
      # This step runs BEFORE the upload below, which is what makes it a gate.
      # A failure here means no artifact is ever published, so nothing
      # downstream can sign or attach a document that did not check out.
      - name: Assert the documents are still a consumer closure
        env:
          PACKAGE: ${{ matrix.package }}
          SLUG: ${{ matrix.slug }}
          VERSION: ${{ steps.install.outputs.version }}
          BASENAME: ${{ steps.install.outputs.basename }}
        run: |
          node scripts/check-consumer-sbom.mjs \
            --spdx "$BASENAME.spdx.json" \
            --cdx "$BASENAME.cdx.json" \
            --package "$PACKAGE" --slug "$SLUG" --version "$VERSION"

      # One artifact per matrix leg carrying both formats, replacing the two
      # the action used to upload for itself. The NAME has to keep matching
      # `bestax-*sbom*`, which is what `sign-sbom` and `attach-sbom` pass to
      # download-artifact — the basename does, by construction. The file names
      # inside are unchanged, so the globs in those jobs need no change either.
      #
      # No `if:`, deliberately. This step is reached only when every step above
      # it succeeded, which is exactly the gate described above.
      - name: Upload the consumer SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.install.outputs.basename }}
          path: |
            ${{ steps.install.outputs.basename }}.spdx.json
            ${{ steps.install.outputs.basename }}.cdx.json
          # Fail rather than warn: reaching this step means the documents
          # checked out, so a missing file is a bug in this job and not a
          # degradation to absorb quietly.
          if-no-files-found: error

  # Scorecard's Signed-Releases check reads GitHub *release assets* and nothing
  # else. The npm provenance we already publish is invisible to it, so releases
  # carrying SBOMs and no recognised signature scored 0 on that check (#404).
  #
  # This is a third job rather than a step bolted onto either neighbour, and the
  # split is the whole design. Generation runs `pnpm install` and third-party
  # actions, so it must not hold a credential. Upload holds `contents: write`,
  # so it must not gain new third-party code. Signing needs `id-token: write`
  # and nothing else, so it gets its own job and both existing guarantees stand.
  #
  # Residual risk, stated rather than papered over: `id-token: write` lets code
  # in THIS job mint an OIDC token asserting this repository's identity, which
  # Fulcio exchanges for a short-lived signing certificate. The job holds no
  # repository write token, so the exposure is bounded at signing something as
  # bestax, not at changing anything here. cosign-installer is SHA-pinned and
  # the cosign binary is version-pinned below; that is the whole mitigation, and
  # it is a cost-raiser rather than a proof.
  sign-sbom:
    name: Sign the SBOMs
    runs-on: ubuntu-latest
    needs: [sbom, consumer-sbom]
    # The status-check function is load-bearing, not decoration. An `if` with no
    # status function is implicitly `success() && (...)`, which means EVERY job
    # in `needs` must succeed — so adding `consumer-sbom` here would make one
    # flaky `npm install` in any of four matrix legs skip this job entirely and
    # ship the release with its *repository* SBOMs unsigned. That is a
    # Signed-Releases score of 0 (#404) caused by an unrelated registry hiccup.
    #
    # Repository-SBOM signing must depend only on `sbom`, which is
    # deterministic (pnpm, frozen lockfile). Consumer SBOMs are additive: if
    # their job failed there is simply nothing extra to sign, and the glob below
    # expands to nothing.
    if: >
      !cancelled() && github.event_name == 'release' &&
      needs.sbom.result == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      # Rule 10: a new job ships at `block`.
      #
      # Egress-block enforces here, and the step after harden-runner asserts it.
      # What used to be a hypothesis in this comment is now settled twice over:
      # #487's root cause was the Actions cache going read-only for **untrusted
      # triggers** (`issues`, `issue_comment`, `pull_request`) and this job runs
      # on `release`, which is not in that class — and harden-runner v2.21.0
      # removed the fail-open path altogether.
      #
      # One thing genuinely remains unmeasured, so do not read more into the
      # above than it says: this job only fires on `release: published` and
      # cannot be exercised from a PR or a dispatch, so its allowlist has never
      # seen a real run. It is written as if enforced — which it now is — but it
      # was assembled by reading the actions, not from a StepSecurity report. If
      # a host is missing the cost is a signature rather than a release:
      # `attach-sbom` no longer depends on this job succeeding, so the failure
      # mode is "SBOMs attach unsigned plus a ::warning::". Widen the list from
      # the first real run's report rather than by guessing again.
      #
      # Sigstore hosts are the four in its published signing config
      # (tuf-repo-cdn serves that config; fulcio issues the cert; rekor logs it;
      # timestamp countersigns the bundle). `oauth2.sigstore.dev` is the fifth
      # entry there and is deliberately omitted: it serves the interactive OIDC
      # flow, and this job uses the ambient GitHub Actions credential instead.
      #
      # `*.blob.core.windows.net` is deliberately absent, and this note exists
      # because three separate review passes have now proposed adding it. The
      # artifact actions do reach Azure blob storage, but #487 measured a real
      # run and found those hosts (`results-receiver.actions.githubusercontent
      # .com`, `productionresultssa9.blob.core.windows.net`) already covered by
      # harden-runner's built-in Actions baseline, so allow-listing them is
      # unnecessary. In block mode harden-runner also runs a probe whose whole
      # purpose is to discover the per-run blob backend host and add it itself —
      # since v2.21.0 that probe is allowed to come up empty without changing the
      # policy, because the agent admits the cache endpoints implicitly and the
      # probe is defense-in-depth on top of that.
      # The wildcard is the specific thing to avoid: every Azure storage account
      # in existence lives under that suffix, so it would turn the tightest
      # egress policy in this repository into something close to open egress. If
      # a real run ever shows a blocked blob endpoint, add that exact host.
      #
      # Of this file's four other jobs, three (`sbom`, `attach-sbom`,
      # `verify-provenance`) predate rule 10 and are grandfathered by its
      # "existing live job" clause. `consumer-sbom` is not grandfathered and
      # enforces, same as this job — do not read the grandfather clause as
      # covering it.
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443

      # Asserts the policy the pre-step decided (agent.json) AND that the agent
      # actually came up (agent.status, written only once the firewall rules are
      # installed). Either alone is a false pass: #487 was the first kind, and an
      # unresolvable host in this allowlist was the second, on this PR's own run.
      #
      # Scope it honestly: this proves enforcement was armed AT THIS STEP. It does
      # NOT prove the policy stays armed — the agent writes `Initialized` and then
      # serves, and a later runtime error makes it revert the firewall with both
      # files still reading exactly as they do here. Rule 10 in .github/CLAUDE.md
      # carries the mechanism and what to check when a session looks wrong.
      #
      # One more scope limit, because rule 10's "fails the job instead of degrading
      # in silence" is true of the JOB and not the pipeline: `attach-sbom` needs
      # this job but gates on `!cancelled()` and only requires `sbom` to have
      # succeeded, so a failed assertion here does not stop the release — the SBOMs
      # attach unsigned with a ::warning::, indistinguishable from the Fulcio/Rekor
      # outage that gating was written for. Deliberate (nothing here may fail a
      # release), but do not read a green release as proof this assertion passed.
      #
      # Linux-only paths (macOS uses /opt/step-security); all runners are ubuntu-latest.
      - name: Assert egress policy is enforced
        run: |
          set -uo pipefail
          # harden-runner has several deliberate "install nothing, exit 0" paths
          # (StepSecurity unavailable, the skip-harden-runner repo property, a
          # container or slim runner). None of them writes agent.json, so name
          # that case rather than leaving a bare jq "could not open file".
          if [ ! -e /home/agent/agent.json ]; then
            echo "::error::harden-runner installed no agent, so nothing is enforcing egress. Usual causes: a StepSecurity outage (its pre-step returns green without installing), the skip-harden-runner repo property, or a container/slim runner. This job holds a credential and will not run unprotected (#487)."
            exit 1
          fi
          if ! jq -e '.egress_policy == "block"' /home/agent/agent.json; then
            echo "::error::effective egress policy is not block — harden-runner downgraded it (#487)."
            exit 1
          fi
          # Poll rather than test once: the pre-step waits only for the file to
          # EXIST and gives up after ~9s, while the agent resolves every
          # allow-listed host before writing its status, so a cold resolver or a
          # long list can leave the file absent or still empty here.
          for _ in $(seq 1 30); do
            if grep -q '^Initialized' /home/agent/agent.status 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::agent.json reads block but the agent never reported Initialized — the firewall is not up. Check the agent log for 'Reverted changes' (usually an unresolvable allow-listed host)."
          exit 1

      # `bestax-*sbom*` rather than `bestax-sbom.*`: the consumer SBOMs are
      # named apart from the repository pair on purpose (nobody should confuse
      # the two), so the narrower pattern would silently sign only half of what
      # gets attached.
      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bestax-*sbom*
          merge-multiple: true

      # cosign-release is pinned rather than left to the action's default so a
      # future SHA bump cannot change the signing binary as a side effect.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Keyless: the certificate binds each signature to this workflow's OIDC
      # identity, so there is no long-lived key to store, rotate, or leak.
      #
      # One output per SBOM. cosign v3 removed --output-signature/-certificate,
      # leaving --bundle, which writes everything a verifier needs in the new
      # bundle format. The `.sigstore.json` suffix is load-bearing twice over:
      # it is what `cosign verify-blob --bundle` consumes, and it is in the
      # signatureExtensions list of scorecard v5.5.0, which is the version
      # scorecard-action v2.4.4 actually vendors (checked, not assumed).
      # Globbed rather than listed, so a new SBOM cannot be attached unsigned
      # just because somebody forgot to add it here. nullglob covers only the
      # two patterns: the repository pair are literal filenames it cannot
      # remove, and what guarantees those exist is `needs.sbom.result ==
      # 'success'` in this job's `if`, not the shopt.
      - name: Sign the SBOMs
        run: |
          shopt -s nullglob
          for f in bestax-sbom.spdx.json bestax-sbom.cdx.json \
                   bestax-consumer-sbom-*.spdx.json bestax-consumer-sbom-*.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      # Named to match the upload job's `bestax-*sbom*` download pattern (both
      # were widened in #424 so the consumer SBOMs are collected too), so that
      # step needs no change to pick these up.
      #
      # `!cancelled()` so a partial signing run still publishes what it managed
      # to produce. The loop above runs under `bash -e`, so if the second
      # cosign call fails the step fails and this one would be skipped by
      # default, discarding the bundle the first call had already written. That
      # would turn "one SBOM signed" into "nothing signed", which is both a
      # worse outcome than the failure warrants and inconsistent with
      # attach-sbom, which is deliberately built to degrade rather than
      # withhold. The job still goes red — this changes what survives the
      # failure, not whether it is reported. `upload-artifact` defaults to
      # `if-no-files-found: warn`, so a total signing failure uploads nothing
      # and attach-sbom's nullglob branch emits its ::warning:: as before.
      - name: Upload signature bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bestax-sbom.signatures
          path: |
            bestax-sbom.spdx.json.sigstore.json
            bestax-sbom.cdx.json.sigstore.json
            bestax-consumer-sbom-*.sigstore.json
          retention-days: 5

  # Workflow artifacts expire; a release asset is the durable, linkable copy an
  # auditor can actually cite. Isolated from generation so the write-scoped
  # token exists only on release runs, in a job that installs nothing and runs
  # no third-party code beyond the artifact download.
  attach-sbom:
    name: Attach SBOMs and signatures to the release
    runs-on: ubuntu-latest
    needs: [sbom, consumer-sbom, sign-sbom]
    # Signing is additive and must not be able to cost us the SBOMs themselves.
    # A plain `needs: sign-sbom` would mean a transient Fulcio or Rekor outage
    # leaves the release with no SBOM assets at all, which is strictly worse
    # than the unsigned pair we shipped before signing existed. So the only
    # dependency this job actually requires is `sbom`; a failed `sign-sbom`
    # degrades to attaching the SBOMs unsigned.
    #
    # `!cancelled()` rather than `always()`: a cancelled release run should stay
    # cancelled, not push assets on its way out.
    if: >
      !cancelled() && github.event_name == 'release' &&
      needs.sbom.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bestax-*sbom*
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The repository SBOMs are the guarantee that predates signing, so
          # they go up first and on their own.
          gh release upload "$TAG" \
            bestax-sbom.spdx.json \
            bestax-sbom.cdx.json \
            --clobber --repo "$GITHUB_REPOSITORY"

          # Consumer SBOMs are best-effort for the same reason the signature
          # bundles are: the job's `if` requires only `needs.sbom`, so a failed
          # consumer-sbom leg degrades to "the repository SBOMs still ship"
          # rather than costing the release its evidence entirely. nullglob so a
          # missing set expands to nothing.
          # Matched on the format suffix rather than a bare `*.json`, which
          # also excludes the signature bundles: those are named
          # `<sbom>.spdx.json.sigstore.json`, so they do not end in `.spdx.json`
          # and are collected separately below instead of being uploaded twice.
          shopt -s nullglob
          consumer=(
            bestax-consumer-sbom-*.spdx.json
            bestax-consumer-sbom-*.cdx.json
          )
          #
          # The `|| echo` is load-bearing, not defensive habit. `run:` executes
          # under `bash -e`, so an upload failure here (502, rate limit, asset
          # size) would abort the step before the signature bundles below are
          # attached — shipping a release with SBOMs and no signatures, scoring
          # Signed-Releases 0 (#404). That is the exact outcome this job is
          # built to avoid, and the `[ -gt 0 ]` guard does not cover it: it
          # tests "no files found", not "upload failed".
          if [ ${#consumer[@]} -gt 0 ]; then
            gh release upload "$TAG" "${consumer[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::Consumer SBOM upload failed; the repository SBOMs and signatures still ship."
          else
            echo "::warning::No consumer SBOMs found. The repository SBOM still describes the dev toolchain, but the consumer closure (#424) is missing from this release."
          fi

          # Bundles are best-effort by the job's `if`. nullglob so a missing
          # set expands to nothing rather than to a literal pattern that
          # `gh` would then fail to open.
          sigs=(bestax-*sbom*.sigstore.json)
          if [ ${#sigs[@]} -gt 0 ]; then
            gh release upload "$TAG" "${sigs[@]}" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::No signature bundles found. SBOMs attached unsigned; Signed-Releases will score this release 0."
          fi

  verify-provenance:
    name: Verify published provenance
    runs-on: ubuntu-latest

    steps:
      # The provenance assertion moved out of this file and into
      # scripts/verify-attestation.mjs (#526), because checking what an
      # attestation *says* means decoding a base64 DSSE payload and comparing
      # nine fields — rule 9 logic, not a shell loop. So the job now needs the
      # repository on disk.
      #
      # This adds a second third-party action to a job that had one, which is
      # the honest cost of that move rather than something to elide. It is on
      # the repo-wide pin, and `persist-credentials: false` means no token is
      # written to the runner's git config. The job still declares no
      # `permissions:` and still inherits the workflow-level `contents: read`.
      #
      # `ref: main` is load-bearing, not tidiness. Without it checkout takes the
      # event ref, and this job's primary trigger is `release: published` — so
      # the verifier would be read from the release tag. A tag pointing at a
      # commit whose verify-attestation.mjs simply exits 0 would pass this gate
      # while proving nothing, which bypasses the exact control being added. The
      # inline shell this replaces had that property for free by living in the
      # workflow file; moving the logic into scripts/ is what makes it something
      # to state explicitly. Measured, not assumed: past release-triggered runs
      # of this workflow record `head_branch` as the tag
      # (e.g. `@allxsmith/bestax-bulma@5.11.1`).
      #
      # `github.workflow_sha` was proposed instead and is wrong here for the
      # same reason — on a release event the workflow file itself comes from the
      # tag, so pinning to it would reintroduce exactly the exposure `main`
      # closes. The residual gap is that `main` resolves when checkout runs, so
      # a push landing in that window changes the verifier: much smaller, since
      # `main` is protected by a ruleset that admits only reviewed PRs and the
      # release App's `chore(release)` commit, and anyone able to push there has
      # already defeated more than this step.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # SECURITY.md tells consumers to run `npm audit signatures`; this closes
      # the loop by running it ourselves against the real published tarballs
      # rather than the local workspace. npm (not pnpm) on purpose: the
      # signature audit needs an npm-resolved tree and lockfile.
      #
      # This step is itself the assertion, not just setup for the audit below:
      # `npm install` exits non-zero on an uninstallable package, so the job
      # goes red whether the artifact is unsigned or simply broken. That is the
      # check #412 did not have — it shipped an uninstallable `workspace:^`
      # manifest precisely because everything else in CI resolves against the
      # workspace, where the specifier works.
      #
      # This list is the single source of truth for what gets verified: the
      # assertion step below reads the roster back out of this tree rather than
      # repeating it.
      - name: Install published packages into a scratch tree
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          npm init -y > /dev/null
          npm install --ignore-scripts \
            @allxsmith/bestax-bulma create-bestax bestax-migrate bestax-mcp

      - name: Audit registry signatures and provenance attestations
        run: |
          cd "$RUNNER_TEMP/verify"
          npm audit signatures

      # `npm audit signatures` only fails on signatures/attestations that are
      # *invalid*, and it stays green when provenance is simply absent. It also
      # never opens the attestation: a validly signed statement naming somebody
      # else's repository satisfies it completely.
      #
      # So this step asserts the contents (#526) — that each installed tarball's
      # digest is the one the attestation signs, and that the build it describes
      # is this repository, this workflow, this ref, on a GitHub-hosted runner.
      # The logic lives in scripts/ with a node --test sibling, per rule 9,
      # because it decodes a base64 DSSE payload and compares nine fields; that
      # is not something a shell loop can be tested for.
      #
      # Fails closed everywhere: a fetch error, an unparsable payload, or a
      # missing field is a failure, never a silent pass.
      #
      # No package list here on purpose. It reads the roster back out of the
      # scratch tree, so the install step above is the single place the
      # packages are named. Listing them twice made "keep these in sync" a
      # hand-maintained invariant with nothing enforcing it — add a fifth
      # published package to one and not the other and it ships unverified,
      # silently, green.
      - name: Assert the attestations say this repository built these tarballs
        run: node scripts/verify-attestation.mjs --dir "$RUNNER_TEMP/verify"
