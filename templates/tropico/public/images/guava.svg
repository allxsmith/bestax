<path d="M110,40 l-4,-14 M100,30 l20,-4" stroke="#5a4a1e" stroke-width="5" stroke-linecap="round"/>
<path d="M70,90 a40,50 0 0,1 26,-36" stroke="#eef5b0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>
<g fill="#6f9a30"><circle cx="130" cy="150" r="2.5"/><circle cx="150" cy="110" r="2.5"/><circle cx="96" cy="170" r="2.5"/><circle cx="76" cy="140" r="2"/></g>
</g>
<g transform="rotate(18 194 80)">
<path d="M194,20 C226,20 246,50 242,84 C238,118 216,134 194,132 C168,130 150,112 152,80 C154,46 170,20 194,20 Z" fill="url(#skin)"/>
