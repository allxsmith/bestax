<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322 275" width="322" height="275">
<!-- Drawn for the bestax port of the Tropico template; image-provenance.json records it. -->
<!-- Two whole guavas on a leaf and a halved one showing its pink flesh and seeds. -->
<defs>
<radialGradient id="skin" cx="0.38" cy="0.35" r="0.75">
<stop offset="0" stop-color="#d4e86a"/>
<stop offset="1" stop-color="#7fae3a"/>
</radialGradient>
<radialGradient id="flesh" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ff9aa2"/>
<stop offset="1" stop-color="#f26b7a"/>
</radialGradient>
</defs>
<ellipse cx="161" cy="256" rx="140" ry="12" fill="#000000" opacity="0.08"/>
<!-- A broad leaf under the fruit. -->
<path d="M20,214 C70,150 170,138 300,170 C220,230 110,248 20,214 Z" fill="#3f8f4a"/>
<path d="M28,212 C120,190 210,178 292,172" stroke="#2f7a3c" stroke-width="3" fill="none"/>
<path d="M90,200 l-10,-24 M140,192 l-6,-28 M190,186 l0,-26 M240,180 l6,-22 M120,196 l8,26 M170,188 l10,26 M220,182 l12,22" stroke="#2f7a3c" stroke-width="2"/>
<!-- The whole guavas. -->
<g transform="rotate(-12 110 120)">
