<g fill="#6f9a30"><circle cx="212" cy="96" r="2"/><circle cx="222" cy="64" r="2"/><circle cx="180" cy="108" r="2"/></g>
</g>
<!-- The halved guava. -->
<g transform="translate(232 178) rotate(-8)">
<ellipse rx="66" ry="56" fill="#7fae3a"/>
<ellipse rx="60" ry="50" fill="#fbe7c8"/>
<ellipse rx="54" ry="44" fill="url(#flesh)"/>
<ellipse rx="26" ry="20" fill="#ffc3c8"/>
<g fill="#f4dfb0">
<circle cx="-12" cy="-8" r="3"/><circle cx="0" cy="-12" r="3"/><circle cx="12" cy="-8" r="3"/>
<circle cx="16" cy="4" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="-8" cy="12" r="3"/>
<circle cx="-18" cy="2" r="3"/><circle cx="0" cy="2" r="3"/>
