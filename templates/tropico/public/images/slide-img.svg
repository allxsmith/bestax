<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 448" width="624" height="448">
<!-- Drawn for the bestax port of the Tropico template; image-provenance.json records it. -->
<!-- A bowl of tropical fruit: a pineapple, bananas, oranges, a halved papaya and a mango. -->
<defs>
<radialGradient id="backdrop" cx="312" cy="230" r="230" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffe2c4"/>
<stop offset="1" stop-color="#ffd3a8"/>
</radialGradient>
<linearGradient id="bowl" x1="0" y1="300" x2="0" y2="420" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#d8955a"/>
<stop offset="1" stop-color="#9c5c2e"/>
</linearGradient>
<radialGradient id="orange" cx="0.38" cy="0.35" r="0.7">
<stop offset="0" stop-color="#ffb347"/>
<stop offset="1" stop-color="#f07c12"/>
</radialGradient>
<radialGradient id="mango" cx="0.35" cy="0.3" r="0.8">
<stop offset="0" stop-color="#ffd166"/>
<stop offset="0.6" stop-color="#f4a340"/>
<stop offset="1" stop-color="#d9532b"/>
</radialGradient>
<pattern id="scales" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="22" height="22" fill="#e9a93a"/>
<rect width="22" height="2" fill="#b77a1f"/>
<rect width="2" height="22" fill="#b77a1f"/>
<circle cx="11" cy="11" r="2.4" fill="#8a5a17"/>
</pattern>
<g id="orangefruit">
<circle r="46" fill="url(#orange)"/>
<circle cx="-14" cy="-16" r="2" fill="#ffd08a"/><circle cx="6" cy="-22" r="2" fill="#ffd08a"/>
<circle cx="-22" cy="4" r="2" fill="#ffd08a"/><circle cx="14" cy="10" r="1.6" fill="#e06a0c"/>
<circle cx="-2" cy="-44" r="4" fill="#5a7d2a"/>
</g>
</defs>

<circle cx="312" cy="230" r="216" fill="url(#backdrop)"/>
<!-- Leaves behind the fruit. -->
<g fill="#3f8f4a">
<path d="M150,300 C90,250 70,190 86,140 C120,190 150,240 176,300 Z"/>
<path d="M470,300 C540,262 572,206 566,150 C526,196 492,244 448,300 Z"/>
</g>
<g fill="#2f7a3c">
<path d="M170,300 C130,220 140,170 168,128 C178,190 186,244 194,300 Z"/>
<path d="M452,300 C500,236 504,186 486,140 C468,198 456,250 432,300 Z"/>
</g>

<!-- The pineapple, standing at the back. -->
<g fill="#4f9a3e">
<path d="M330,170 C300,110 290,70 300,30 C318,80 330,120 340,170 Z"/>
<path d="M340,170 C346,100 362,60 390,36 C376,90 362,130 352,172 Z"/>
<path d="M336,170 C320,120 280,96 250,92 C286,120 306,146 326,176 Z" fill="#3d8432"/>
<path d="M344,170 C366,128 404,108 434,108 C400,130 378,152 356,178 Z" fill="#3d8432"/>
<path d="M338,170 C334,110 338,64 350,20 C356,70 352,118 346,172 Z" fill="#5fae4a"/>
</g>
<ellipse cx="342" cy="250" rx="64" ry="92" fill="url(#scales)"/>
<ellipse cx="342" cy="250" rx="64" ry="92" fill="none" stroke="#b77a1f" stroke-width="3"/>

<!-- A bunch of bananas, left. -->
<g stroke="#b38a1e" stroke-width="2">
<path d="M122,262 C136,196 196,152 262,150 C210,170 166,206 146,268 Z" fill="#ffd84a"/>
<path d="M134,262 C158,206 214,178 274,182 C222,194 182,224 160,270 Z" fill="#ffe36b"/>
<path d="M144,266 C176,224 226,208 278,216 C230,222 196,240 172,274 Z" fill="#ffd84a"/>
</g>
<path d="M262,150 l12,-6 l4,10 l-12,4 Z M274,182 l12,-4 l2,10 l-12,2 Z M278,216 l12,-2 l0,10 l-12,0 Z" fill="#5a4a1e"/>
<path d="M120,262 l14,-14 l18,14 l-10,14 Z" fill="#7a8a2a"/>

<!-- The bowl. -->
<path d="M90,300 L534,300 C534,372 444,424 312,424 C180,424 90,372 90,300 Z" fill="url(#bowl)"/>
<ellipse cx="312" cy="300" rx="222" ry="20" fill="#e6a86a"/>
<path d="M120,336 C200,356 424,356 504,336" stroke="#b9743f" stroke-width="4" fill="none"/>
<path d="M146,372 C220,390 404,390 478,372" stroke="#b9743f" stroke-width="4" fill="none"/>
<rect x="262" y="420" width="100" height="14" rx="6" fill="#8a4f26"/>

<!-- Fruit in the bowl: oranges, a mango and a halved papaya. -->
<use href="#orangefruit" x="200" y="282"/>
<use href="#orangefruit" x="282" y="296"/>
<ellipse cx="440" cy="284" rx="62" ry="40" fill="url(#mango)" transform="rotate(-18 440 284)"/>
<path d="M486,262 c8,-10 18,-12 26,-8" stroke="#5a7d2a" stroke-width="4" fill="none" stroke-linecap="round"/>
<g transform="rotate(10 366 300)">
<ellipse cx="366" cy="300" rx="70" ry="34" fill="#7cb342"/>
<ellipse cx="366" cy="300" rx="62" ry="28" fill="#ff8a50"/>
<ellipse cx="370" cy="300" rx="30" ry="12" fill="#ffb07a"/>
<g fill="#2b2b2b">
<circle cx="352" cy="298" r="3.4"/><circle cx="362" cy="294" r="3.4"/><circle cx="372" cy="297" r="3.4"/>
<circle cx="382" cy="301" r="3.4"/><circle cx="360" cy="304" r="3.4"/><circle cx="374" cy="306" r="3.4"/>
<circle cx="388" cy="296" r="3.4"/><circle cx="350" cy="306" r="3"/>
</g>
</g>
<!-- An orange slice leaning on the front. -->
<g transform="translate(150 360)">
<circle r="34" fill="#f07c12"/>
<circle r="29" fill="#ffd9a0"/>
<g fill="#ffa53a">
<path d="M0,0 L0,-26 A26,26 0 0,1 22.5,-13 Z"/><path d="M0,0 L22.5,-13 A26,26 0 0,1 22.5,13 Z"/>
<path d="M0,0 L22.5,13 A26,26 0 0,1 0,26 Z"/><path d="M0,0 L0,26 A26,26 0 0,1 -22.5,13 Z"/>
<path d="M0,0 L-22.5,13 A26,26 0 0,1 -22.5,-13 Z"/><path d="M0,0 L-22.5,-13 A26,26 0 0,1 0,-26 Z"/>
</g>
<g stroke="#ffd9a0" stroke-width="3"><path d="M0,0 L0,-27 M0,0 L23.4,-13.5 M0,0 L23.4,13.5 M0,0 L0,27 M0,0 L-23.4,13.5 M0,0 L-23.4,-13.5"/></g>
<circle r="4" fill="#ffe7c2"/>
