<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Participation Form - Free Bulma Template</title>
    <meta name="author" content="github.com/aldi" />
    <meta
      name="description"
      content="Free Bulma Event Participation Template, part of Awesome Bulma Templates, rebuilt with bestax"
    />
    <meta
      name="keywords"
      content="bulma, bulma-css, event, participation, template, free, awesome"
    />
    <script>
      // Bulma's scheme on <html> before the first paint: the saved choice,
      // or else the OS preference. src/colorMode.ts saves under the same key.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch {
          // Storage is blocked, so fall back to the OS preference.
        }
        const dark =
          saved === 'light' || saved === 'dark'
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
