<svg xmlns="http://www.w3.org/2000/svg" width="660" height="309" viewBox="0 0 660 309">
  <!-- Drawn for the bestax port of the Rent template; image-provenance.json records how. -->
  <defs>
    <!-- Windows at night: a few lit, most dark, in two arrangements. -->
    <pattern id="lit-a" width="24" height="30" patternUnits="userSpaceOnUse">
      <g fill="#ffd66b">
        <rect x="1" y="2" width="4" height="6" />
        <rect x="13" y="2" width="4" height="6" />
        <rect x="7" y="12" width="4" height="6" />
        <rect x="19" y="22" width="4" height="6" />
      </g>
      <g fill="#33475e">
        <rect x="7" y="2" width="4" height="6" />
        <rect x="19" y="2" width="4" height="6" />
        <rect x="1" y="12" width="4" height="6" />
        <rect x="13" y="12" width="4" height="6" />
        <rect x="19" y="12" width="4" height="6" />
        <rect x="1" y="22" width="4" height="6" />
        <rect x="7" y="22" width="4" height="6" />
        <rect x="13" y="22" width="4" height="6" />
      </g>
    </pattern>
    <pattern id="lit-b" width="30" height="24" patternUnits="userSpaceOnUse">
      <g fill="#ffd66b">
        <rect x="8" y="2" width="5" height="4" />
        <rect x="23" y="10" width="5" height="4" />
        <rect x="1" y="18" width="5" height="4" />
        <rect x="16" y="18" width="5" height="4" />
      </g>
      <g fill="#33475e">
        <rect x="1" y="2" width="5" height="4" />
        <rect x="16" y="2" width="5" height="4" />
        <rect x="23" y="2" width="5" height="4" />
        <rect x="1" y="10" width="5" height="4" />
        <rect x="8" y="10" width="5" height="4" />
        <rect x="16" y="10" width="5" height="4" />
        <rect x="8" y="18" width="5" height="4" />
        <rect x="23" y="18" width="5" height="4" />
      </g>
    </pattern>
    <pattern id="floors" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect y="5" width="10" height="3" fill="#ffd66b" opacity="0.75" />
    </pattern>
  </defs>

  <!-- The back row. -->
  <g fill="#3a5068">
    <rect x="20" y="132" width="50" height="177" />
    <rect x="188" y="96" width="42" height="213" />
    <rect x="352" y="120" width="48" height="189" />
    <rect x="520" y="86" width="44" height="223" />
    <rect x="610" y="150" width="50" height="159" />
  </g>

  <!-- The front row, left to right. -->
  <g fill="#1d2b3a">
    <rect x="0" y="178" width="46" height="131" />
    <rect x="46" y="112" width="40" height="197" />
    <rect x="86" y="58" width="52" height="251" />
    <rect x="104" y="40" width="16" height="20" />
    <rect x="110" y="14" width="4" height="28" />
    <rect x="138" y="150" width="56" height="159" />
    <rect x="194" y="200" width="48" height="109" />
    <rect x="242" y="118" width="58" height="191" />
    <path d="M300 309V136L332 104L364 136V309Z" />
    <rect x="364" y="210" width="64" height="99" />
    <rect x="428" y="96" width="44" height="213" />
    <rect x="472" y="44" width="50" height="265" />
    <rect x="486" y="22" width="22" height="24" />
    <rect x="495" y="2" width="4" height="22" />
    <rect x="522" y="160" width="40" height="149" />
    <rect x="562" y="106" width="52" height="203" />
    <rect x="614" y="196" width="46" height="113" />
  </g>

  <!-- A water tower on the low roof. -->
  <g fill="#1d2b3a">
    <rect x="384" y="186" width="24" height="16" rx="3" />
    <path d="M384 186L396 176L408 186Z" />
    <rect x="387" y="202" width="3" height="8" />
    <rect x="402" y="202" width="3" height="8" />
  </g>

  <!-- Their windows. -->
  <rect x="6" y="186" width="34" height="118" fill="url(#lit-a)" />
  <rect x="52" y="120" width="28" height="184" fill="url(#floors)" />
  <rect x="94" y="68" width="36" height="236" fill="url(#lit-b)" />
  <rect x="144" y="158" width="44" height="146" fill="url(#lit-a)" />
  <rect x="200" y="208" width="36" height="96" fill="url(#lit-b)" />
  <rect x="248" y="126" width="46" height="178" fill="url(#lit-a)" />
  <rect x="310" y="142" width="44" height="162" fill="url(#floors)" />
  <rect x="368" y="218" width="56" height="86" fill="url(#lit-b)" />
  <rect x="434" y="104" width="32" height="200" fill="url(#lit-a)" />
  <rect x="478" y="54" width="38" height="250" fill="url(#lit-b)" />
  <rect x="528" y="168" width="28" height="136" fill="url(#floors)" />
  <rect x="568" y="114" width="40" height="190" fill="url(#lit-a)" />
  <rect x="620" y="204" width="34" height="100" fill="url(#lit-b)" />

  <!-- A light on each antenna. -->
  <circle cx="112" cy="14" r="3" fill="#f2777a" />
  <circle cx="497" cy="3" r="3" fill="#f2777a" />
</svg>
