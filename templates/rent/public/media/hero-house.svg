<svg xmlns="http://www.w3.org/2000/svg" width="561" height="275" viewBox="0 0 561 275">
  <!-- Drawn for the bestax port of the Rent template; image-provenance.json records how. -->
  <!-- A street of three homes for rent: an apartment block, a narrow townhouse and a cottage,
       with a "For rent" banner, along a sidewalk. -->
  <rect x="36" y="40" width="489" height="222" rx="111" fill="#e2f5f1" />

  <!-- The apartment block, left. -->
  <rect x="70" y="70" width="150" height="192" fill="#ffffff" stroke="#26415e" stroke-width="2.5" />
  <rect x="64" y="62" width="162" height="12" rx="2" fill="#26415e" />
  <g fill="#bfe9f5" stroke="#26415e" stroke-width="2">
    <rect x="86" y="88" width="30" height="26" /><rect x="130" y="88" width="30" height="26" /><rect x="174" y="88" width="30" height="26" />
    <rect x="86" y="132" width="30" height="26" /><rect x="130" y="132" width="30" height="26" /><rect x="174" y="132" width="30" height="26" />
    <rect x="86" y="176" width="30" height="26" /><rect x="174" y="176" width="30" height="26" />
  </g>
  <g fill="#26415e">
    <rect x="82" y="114" width="38" height="5" /><rect x="170" y="114" width="38" height="5" />
    <rect x="82" y="158" width="38" height="5" /><rect x="170" y="158" width="38" height="5" />
  </g>
  <rect x="128" y="218" width="34" height="44" fill="#00b39b" stroke="#26415e" stroke-width="2.5" />
  <rect x="124" y="208" width="42" height="10" rx="2" fill="#26415e" />
  <!-- Its banner. -->
  <rect x="116" y="178" width="58" height="24" rx="3" fill="#ffd66b" stroke="#26415e" stroke-width="2" />
  <text x="145" y="194.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#26415e">FOR RENT</text>

  <!-- The townhouse, middle: tall and narrow, with a stoop. -->
  <rect x="236" y="96" width="92" height="166" fill="#f2777a" stroke="#26415e" stroke-width="2.5" />
  <path d="M230 98H334V86H230Z" fill="#26415e" />
  <g fill="#fdf1dc" stroke="#26415e" stroke-width="2">
    <rect x="250" y="110" width="26" height="36" rx="13" /><rect x="290" y="110" width="26" height="36" rx="13" />
    <rect x="250" y="164" width="26" height="36" /><rect x="290" y="164" width="26" height="36" />
  </g>
  <rect x="266" y="216" width="32" height="40" fill="#26415e" />
  <rect x="270" y="220" width="24" height="36" fill="#4f7aa8" />
  <g fill="#c9d3dd">
    <rect x="258" y="256" width="48" height="4" /><rect x="254" y="260" width="56" height="4" />
  </g>

  <!-- The cottage, right. -->
  <rect x="352" y="170" width="130" height="92" fill="#fdf1dc" stroke="#26415e" stroke-width="2.5" />
  <path d="M342 174L417 122L492 174Z" fill="#4fae7b" stroke="#26415e" stroke-width="2.5" stroke-linejoin="round" />
  <rect x="368" y="190" width="36" height="30" fill="#bfe9f5" stroke="#26415e" stroke-width="2" />
  <path d="M386 191V219M369 205H403" stroke="#fff" stroke-width="2.5" />
  <rect x="428" y="200" width="30" height="62" rx="15" fill="#f2777a" stroke="#26415e" stroke-width="2.5" />
  <circle cx="451" cy="232" r="2.5" fill="#26415e" />
  <circle cx="417" cy="152" r="9" fill="#ffd66b" stroke="#26415e" stroke-width="2" />

  <!-- Bushes and a bike rack. -->
  <ellipse cx="62" cy="258" rx="18" ry="10" fill="#4fae7b" />
  <ellipse cx="228" cy="258" rx="12" ry="8" fill="#6cc08b" />
  <ellipse cx="500" cy="257" rx="22" ry="12" fill="#4fae7b" />
  <path d="M334 262v-14a8 8 0 0 1 16 0v14" fill="none" stroke="#26415e" stroke-width="3" />

  <!-- The sidewalk. -->
  <rect x="30" y="261" width="501" height="6" rx="3" fill="#26415e" />
</svg>
