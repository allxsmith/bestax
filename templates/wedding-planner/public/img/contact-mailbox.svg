<svg xmlns="http://www.w3.org/2000/svg" width="812" height="734" viewBox="0 0 812 734">
  <!-- Drawn for the bestax port of the Wedding Planner template; image-provenance.json records how. -->
  <!-- A letterbox on its post with the flag up, a letter sealed with a heart on its way in,
       and flowers growing round the post. -->
  <circle cx="406" cy="380" r="300" fill="#f6f2fc" />
  <ellipse cx="406" cy="700" rx="300" ry="16" fill="#e9e3f7" />

  <!-- The post. -->
  <rect x="384" y="420" width="44" height="282" rx="6" fill="#c8b3d7" />
  <rect x="384" y="420" width="12" height="282" fill="#b9a6ec" />

  <!-- The letterbox: body, door, and the flag raised. -->
  <path d="M220 300A90 90 0 0 1 310 210H540V430H220Z" fill="#7d6bd6" />
  <path d="M310 210H540A90 90 0 0 1 630 300V430H540Z" fill="#6a59c4" />
  <path d="M540 300A50 50 0 0 1 590 250A40 40 0 0 1 630 300V430H540Z" fill="#5847ad" />
  <rect x="210" y="420" width="430" height="20" rx="8" fill="#3d3b55" />
  <rect x="250" y="300" width="250" height="14" rx="7" fill="#9f8ff0" />
  <path d="M478 222V120" stroke="#3d3b55" stroke-width="10" stroke-linecap="round" />
  <path d="M478 120H544V160H478Z" fill="#e58fb5" />

  <!-- The letter, with its heart seal and a trail behind it. -->
  <path d="M90 196C130 220 160 250 190 300" fill="none" stroke="#c7b8ea" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round" />
  <g transform="rotate(14 250 330)">
    <rect x="170" y="290" width="170" height="110" rx="10" fill="#ffffff" stroke="#d9cff0" stroke-width="4" />
    <path d="M174 296L255 352L336 296" fill="none" stroke="#d9cff0" stroke-width="4" stroke-linejoin="round" />
    <circle cx="255" cy="352" r="20" fill="#e58fb5" />
    <path d="M255 364C245 357 242 352 244 348C247 344 252 345 255 349C258 345 263 344 266 348C268 352 265 357 255 364Z" fill="#ffffff" />
  </g>

  <!-- Flowers round the post. -->
  <g>
    <path d="M330 700C336 640 330 610 318 580M480 700C476 650 486 620 500 590M360 700C370 660 366 640 352 620M450 700C444 666 448 646 462 630" fill="none" stroke="#8fc7a0" stroke-width="6" stroke-linecap="round" />
    <circle cx="318" cy="574" r="18" fill="#eeaeca" /><circle cx="318" cy="574" r="7" fill="#ffe08a" />
    <circle cx="500" cy="584" r="18" fill="#b9a6ec" /><circle cx="500" cy="584" r="7" fill="#ffe08a" />
    <circle cx="352" cy="614" r="14" fill="#ffffff" stroke="#e9e3f7" stroke-width="2" /><circle cx="352" cy="614" r="5" fill="#ffe08a" />
    <circle cx="462" cy="624" r="14" fill="#eeaeca" /><circle cx="462" cy="624" r="5" fill="#ffe08a" />
    <path d="M300 690C290 670 296 650 314 646C318 664 312 680 300 690ZM512 690C522 670 516 650 498 646C494 664 500 680 512 690Z" fill="#8fc7a0" />
  </g>

  <!-- Hearts in the air. -->
  <g fill="#eeaeca">
    <path d="M640 170C618 155 612 144 616 136C620 128 632 128 640 138C648 128 660 128 664 136C668 144 662 155 640 170Z" />
    <path d="M700 260C686 251 682 244 685 239C688 234 695 234 700 240C705 234 712 234 715 239C718 244 714 251 700 260Z" />
  </g>
</svg>
