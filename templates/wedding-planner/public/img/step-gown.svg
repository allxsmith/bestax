  <circle cx="502" cy="264" r="6" fill="#ffffff" stroke="#e58fb5" stroke-width="3" />
  <path d="M502 304C494 298 492 294 494 291C496 288 500 289 502 292C504 289 508 288 510 291C512 294 510 298 502 304Z" fill="#e58fb5" />

