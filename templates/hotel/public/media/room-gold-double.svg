<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 333" width="500" height="333">
<!-- Drawn for the bestax port of the Hotel template; image-provenance.json records it. -->
<!-- The Executive Gold Double: a wide bed with a gold headboard between two lamps. -->
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="250" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#f4ead6"/>
<stop offset="1" stop-color="#e6d6b8"/>
</linearGradient>
<linearGradient id="floor" x1="0" y1="250" x2="0" y2="333" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#9b6b44"/>
<stop offset="1" stop-color="#7c5233"/>
</linearGradient>
<linearGradient id="sky" x1="0" y1="40" x2="0" y2="200" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#8fc3e6"/>
<stop offset="1" stop-color="#d6ecf6"/>
</linearGradient>
<radialGradient id="glow" r="0.5">
<stop offset="0" stop-color="#fff2cc" stop-opacity="0.85"/>
<stop offset="1" stop-color="#fff2cc" stop-opacity="0"/>
</radialGradient>
<pattern id="tufts" x="166" y="138" width="24" height="24" patternUnits="userSpaceOnUse">
<circle cx="12" cy="12" r="2" fill="#a77d2c"/>
</pattern>
<g id="lamp">
<ellipse cx="0" cy="-34" rx="40" ry="30" fill="url(#glow)"/>
<rect x="-3" y="-30" width="6" height="30" fill="#b38a3c"/>
<ellipse cx="0" cy="0" rx="10" ry="3" fill="#8c6a2c"/>
<path d="M-16,-30 L-11,-58 L11,-58 L16,-30 Z" fill="#f8efd9" stroke="#d8c39a"/>
</g>
<g id="stand">
<rect x="-26" y="0" width="52" height="46" fill="#6b4630"/>
<rect x="-26" y="0" width="52" height="5" fill="#80563b"/>
<rect x="-20" y="16" width="40" height="2" fill="#4e3222"/>
<circle cx="0" cy="30" r="2.5" fill="#d2a74b"/>
</g>
</defs>

<rect width="500" height="250" fill="url(#wall)"/>
<rect y="250" width="500" height="83" fill="url(#floor)"/>
<g stroke="#6d4629" stroke-width="1.5">
<path d="M0,266 H500 M0,286 H500 M0,310 H500"/>
</g>
<rect y="244" width="500" height="8" fill="#fbf6ec"/>

<!-- A window with drawn curtains, left. -->
<rect x="18" y="40" width="62" height="160" fill="url(#sky)"/>
<path d="M18,160 C34,150 52,156 80,146 L80,200 L18,200 Z" fill="#8fb38a"/>
<rect x="47" y="40" width="4" height="160" fill="#f8f2e4"/>
<rect x="18" y="118" width="62" height="4" fill="#f8f2e4"/>
<rect x="14" y="36" width="70" height="168" fill="none" stroke="#f8f2e4" stroke-width="6"/>
<path d="M6,30 C14,90 4,160 10,236 L28,236 C22,160 30,90 24,30 Z" fill="#c9973a"/>
<path d="M74,30 C80,90 72,160 78,236 L94,236 C88,160 98,90 92,30 Z" fill="#c9973a"/>
<rect x="2" y="26" width="96" height="6" rx="3" fill="#8c6a2c"/>

<!-- A framed print above the bed. -->
<rect x="212" y="56" width="76" height="56" fill="#b38a3c"/>
<rect x="218" y="62" width="64" height="44" fill="#fbf3e2"/>
<circle cx="240" cy="84" r="10" fill="#e3a64f"/>
<path d="M218,98 C236,88 252,94 282,86 L282,106 L218,106 Z" fill="#c4a76f"/>

<!-- The headboard. -->
<path d="M160,250 L160,150 Q160,130 180,130 L320,130 Q340,130 340,150 L340,250 Z" fill="#c9a24a"/>
<path d="M160,250 L160,150 Q160,130 180,130 L320,130 Q340,130 340,150 L340,250 Z" fill="url(#tufts)"/>

<!-- Nightstands and lamps. -->
<use href="#stand" x="115" y="214"/>
<use href="#lamp" x="115" y="214"/>
<use href="#stand" x="385" y="214"/>
<use href="#lamp" x="385" y="214"/>

<!-- The bed, its pillows, duvet and gold throw. -->
<path d="M168,215 L332,215 L380,318 L120,318 Z" fill="#fbf8f2"/>
<rect x="180" y="200" width="66" height="36" rx="12" fill="#ffffff" stroke="#e2dccf" stroke-width="2"/>
<rect x="254" y="200" width="66" height="36" rx="12" fill="#ffffff" stroke="#e2dccf" stroke-width="2"/>
<rect x="226" y="218" width="48" height="26" rx="8" fill="#d9ac4f"/>
<path d="M152,250 L348,250 L380,318 L120,318 Z" fill="#fffaf0"/>
<path d="M152,250 L348,250" stroke="#e8dfcd" stroke-width="3"/>
<path d="M138,280 L362,280 L372,300 L128,300 Z" fill="#c9973a"/>
<path d="M138,280 L362,280" stroke="#a77d2c" stroke-width="2"/>
<rect x="116" y="318" width="268" height="15" fill="#e6dccb"/>
<rect x="110" y="316" width="280" height="6" rx="3" fill="#8c6a2c"/>
</svg>
