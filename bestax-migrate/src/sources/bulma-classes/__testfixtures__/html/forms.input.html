<form action="/contact" method="post">
  <div class="field">
    <label class="label" for="name">Name</label>
    <div class="control">
      <input class="input" id="name" name="name" type="text" value="Jane" maxlength="40" required>
    </div>
  </div>
  <div class="field">
    <label class="label" for="topic">Topic</label>
    <div class="control">
      <div class="select">
        <select id="topic" name="topic">
          <option>Sales</option>
          <option selected>Support</option>
        </select>
      </div>
    </div>
  </div>
  <div class="field">
    <label class="label" for="message">Message</label>
    <div class="control">
      <textarea class="textarea" id="message" name="message" rows="4" placeholder="Say hello">Hi there</textarea>
    </div>
  </div>
  <div class="field">
    <div class="control">
      <label class="checkbox"><input type="checkbox" name="terms" checked> I agree</label>
    </div>
  </div>
  <div class="field is-grouped">
    <div class="control">
      <button class="button is-link" type="submit">Send</button>
    </div>
    <div class="control">
      <button class="button is-link is-light" type="reset">Cancel</button>
    </div>
  </div>
</form>
