<form>
  <div class="field">
    <div class="control has-icons-left">
      <input class="input" type="email" placeholder="Email">
      <span class="icon is-small is-left">
        <i class="fas fa-envelope" aria-hidden="true"></i>
      </span>
    </div>
  </div>
  <div class="field">
    <div class="control has-icons-left">
      <input class="input" type="search" placeholder="Search">
      <span class="icon is-small is-left">
        <svg class="svg-inline--fa fa-search fa-w-16" aria-hidden="true" data-prefix="fas" data-icon="search" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="currentColor" d="M505 442.7L405.3 343z"></path></svg>
      </span>
    </div>
  </div>
  <button class="button is-info" type="submit">
    <span class="icon">
      <i class="far fa-bell"></i>
    </span>
    <span>Notify me</span>
  </button>
</form>
<div class="buttons">
  <a class="button" href="https://x.com/" aria-label="Follow on X">
    <span class="icon">
      <i class="fa-brands fa-x-twitter fa-lg"></i>
    </span>
  </a>
  <a class="button" href="https://github.com/">
    <span class="icon">
      <i class="fab fa-github fa-lg"></i>
    </span>
  </a>
</div>
<p>
  <span class="icon has-text-success" aria-hidden="true">
    <i class="fas fa-check-square"></i>
  </span>
  <span class="icon is-medium" aria-hidden="true">
    <i class="fa fa-lg fa-envelope-o"></i>
  </span>
  <span class="icon" role="img" aria-label="Warning">
    <i class="fa-solid fa-triangle-exclamation"></i>
  </span>
</p>
<div class="icon">
  <i class="fas fa-home"></i>
</div>
<a href="https://github.com/" aria-label="GitHub">
  <div class="icon">
    <i class="fab fa-github"></i>
  </div>
</a>
<a href="https://twitter.com/">
  <div class="icon">
    <i class="fab fa-twitter" aria-hidden="true"></i>
  </div>
</a>
