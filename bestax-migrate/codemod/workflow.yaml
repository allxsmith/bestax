version: "1"

# A wrapper: Codemod's workflow engine has no jscodeshift step, so this runs the
# published bestax-migrate CLI (jscodeshift inside) as a shell step.
#
# For people running `npx codemod bestax-migrate`:
# - Run it from your app root. Shell steps run in the directory you start from,
#   and `--target` does not move them. Point `paths` at your sources instead.
# - Codemod's own `--dry-run` skips shell steps, so it previews nothing here.
#   The `preview` workflow (`--workflow preview`) is the dry run.
# - An interactive run prints the exact command and asks before running it.
#
# `${{ params.* }}` is Codemod's own template syntax, resolved by the Codemod CLI
# on the machine running the migration. It is what makes the approval prompt
# show the real command rather than variable names.
params:
  schema:
    source:
      name: "Source"
      description: "What the app uses today: react-bulma-components (v4), rbx (v2), bloomer (0.6), or bulma-classes (Bulma classes on plain JSX)"
      type: string
      oneOf:
        - type: string
          enum: ["react-bulma-components", "rbx", "bloomer", "bulma-classes"]
    paths:
      name: "Paths"
      description: "Space-separated files or directories to migrate, relative to where you run the command"
      type: string
      default: "src"
    options:
      name: "Extra options"
      description: "Optional bestax-migrate flags, such as --css keep, --no-deps or --extensions js,jsx. See https://github.com/allxsmith/bestax/tree/main/bestax-migrate#options"
      type: string
      default: ""

nodes:
  - id: migrate
    name: Migrate to @allxsmith/bestax-bulma
    type: automatic
    steps:
      - name: Run the pinned bestax-migrate release from npm
        run: npx --yes bestax-migrate@2.24.0 ${{ params.source }} ${{ params.paths }} ${{ params.options }}
