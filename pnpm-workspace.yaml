packages:
  - bulma-ui
  - docs
  - create-bestax
  - bestax-migrate
  - bestax-mcp
  - eslint-plugin
  - telemetry-worker

# --- Supply-chain hardening ---

# Block-by-default: no dependency here may run install/build lifecycle scripts.
# Every entry is a denial, and #588 retired the last three grants — esbuild,
# @parcel/watcher and unrs-resolver — after showing each one resolves a prebuilt
# platform binary with its script blocked. The list is not redundant with the
# default: each entry records *why* that package's script is unnecessary, so the
# next person to hit `pnpm approve-builds` finds the argument already made. A
# new grant is still possible, and would need a marker (see below); it should
# also have to explain why the platform-binding argument used here does not
# apply to it.
allowBuilds:
  # core-js: its postinstall only prints a funding banner — no build needed.
  core-js: false
  # sass → @parcel/watcher: its `install` script wraps its entire body in
  # `if (process.env.npm_config_build_from_source === 'true')`, which we never
  # set, so the script is a no-op rather than a build. index.js requires the
  # prebuilt @parcel/watcher-<platform> package (13 ship as optionalDependencies)
  # and only falls back to a locally compiled build/Release/watcher.node, which
  # nothing here produces. Grant dropped in #588.
  '@parcel/watcher': false
  # vite/webpack/storybook → esbuild: `node install.js` does three
  # things, none of them required. It resolves a prebuilt @esbuild/<platform>
  # package (26 ship as optionalDependencies), renames that binary over the JS
  # shim at bin/esbuild — a process-startup optimisation, not correctness, since
  # lib/main.js resolves the platform package at runtime either way — and runs
  # the binary once to check its version. Its remaining paths are fallbacks for
  # when no platform package matched: downloadDirectlyFromNPM() fetches a
  # tarball over HTTPS and installUsingNPM() shells out to npm. An install-time
  # script that can reach the network is the thing this list exists to stop, so
  # the grant was costing more than the startup it saved. Grant dropped in #588.
  esbuild: false
  # wrangler (CI-only Cloudflare Pages deploy) pulls these native builds; the
  # `pages deploy` static upload doesn't need them, so keep them blocked.
  sharp: false
  workerd: false

# Every entry in this file's four bypass lists — allowBuilds above, plus
# overrides, the cooldown exclusions, and auditConfig.ignoreGhsas — must carry
# one of these markers in the comment directly above it —
# `check:conformance --only=bypass-expiry` fails the build without one, and
# again once a review date arrives (#391):
#
#   # bestax:review YYYY-MM-DD — why this date
#   # bestax:permanent — why this is not debt
#
# The date is a review-by, not a deadline: when it lands, re-check whether the
# entry still earns its place, then drop it or push the date out with a reason.
# CONTRIBUTING.md has the runbook for adding one during a live advisory.
#
# allowBuilds is the exception to "every entry": only `pkg: true` needs a
# marker. A `pkg: false` entry restates the block-by-default rule rather than
# weakening it, so the gate leaves denials alone — a marker demanded for one
# would be noise, and reflexive markers are worth less than none.
#
# The entries below deliberately share ONE sweep date rather than staggered
# ones. Staggering would spread the same work over more red-gate events, and
# it would be false precision: we cannot predict which parent widens its range
# first, so per-entry dates would be guesses dressed as schedule. One date means
# one sweep, one PR, and (via grouped reporting) one violation rather than
# fourteen. The cost is that the sweep day lands on whoever pushes next — the
# same "unrelated PR goes red" problem #391 is about, which only the deferred
# option C removes. Push the whole batch out together when you sweep.

# Dependency cooldown: refuse to install versions published less than 3 days
# ago (defends against just-published malicious releases, which are usually
# yanked within hours). Add packages to the exclude list for urgent patches.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # bestax:permanent — not a bypass to prune: this formatter's output must be
  # deterministic, so we track the exact version the code is formatted with
  # rather than lag it behind the cooldown (which would cause recurring
  # reformat churn). Dev-only, never shipped to users.
  - prettier

# Pin a single prettier version workspace-wide so eslint-plugin-prettier and
# `prettier --check` never disagree (patch versions format union types
# differently, which otherwise splits into two resolved copies).
overrides:
  # bestax:permanent — a deliberate single-version pin for formatting
  # determinism, not an advisory patch waiting on the ecosystem.
  prettier: 3.9.10
  # The entries below force patched versions of transitive dependencies. Each
  # stops being load-bearing once its parents widen their own ranges, so prune
  # periodically: drop an entry, re-resolve, and leave it out if the resolved
  # version is unchanged and `pnpm audit --audit-level=high` stays clean.
  # Every entry below carries its own marker; this prose annotates nothing.
  # bestax:review 2027-02-13 — quarterly sweep; still load-bearing: Docusaurus's
  # copy-webpack-plugin and css-minimizer-webpack-plugin ask for ^6.
  # Force the patched serialize-javascript (transitive via Docusaurus webpack
  # plugins) — <=7.0.2 has an RCE advisory (GHSA-5c6j-r48x-rmvq). Floor raised
  # to 7.1.3 for a low-severity follow-up advisory against <7.1.3; 7.1.3
  # (2026-10-22) is past the cooldown.
  serialize-javascript: '>=7.1.3'
  # bestax:review 2026-12-01 — drop once the babel chain resolves to
  # >=4.28.7 itself; re-resolve and leave it out if the version is unchanged.
  # Force patched browserslist (transitive via @babel/core and the
  # Docusaurus/vite build chains, and nothing declares it directly).
  # Two high advisories, both fixed in the same release: GHSA-c83g-rgw3-j3cx
  # and GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via an untrusted
  # browserslist-stats.json in normalizeStats). One patched floor covers the
  # whole 4.x line, so this uses the unbounded-lower selector the runbook
  # prescribes for that case rather than pinning whichever major the lockfile
  # holds today.
  'browserslist@<4.28.7': '>=4.28.7'
  # bestax:review 2027-02-13 — quarterly sweep; still load-bearing:
  # docusaurus-plugin-llms still pins minimatch and yaml exactly.
  # Force patched minimatch/yaml under docusaurus-plugin-llms. From 0.5.0 that
  # plugin pins its own dependencies exactly ("minimatch": "9.0.3" rather than
  # "^9.0.3"), so the range no longer floats to a patched release the way it did
  # on 0.4.x. 9.0.3 carries three high ReDoS advisories — GHSA-3ppc-4f35-3m26,
  # GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74 — and the pinned yaml 2.8.1 carries
  # GHSA-48c2-rrv3-qjmp (stack overflow on deeply nested collections). Scoped to
  # the affected major so the minimatch 10.x already in the tree is untouched.
  # Prune both once the plugin widens its ranges again.
  'minimatch@9': '>=9.0.7 <10'
  # bestax:review 2027-02-13 — quarterly sweep; same plugin, separate advisory
  'yaml@2': '>=2.8.3'
  # bestax:review 2027-02-13 — quarterly sweep; still load-bearing:
  # @docusaurus/core asks for tinypool ^1.
  # Force patched tinypool (transitive via @docusaurus/core) for the critical
  # prototype pollution advisories GHSA-5gmw-xhrv-c9v3 and the run() follow-up,
  # fixed in 2.1.2. Docusaurus asks for the 1.x line, so this crosses a major
  # inside the docs build. The docs build in CI is the check that it still works.
  # If it breaks, replace this with a dated auditConfig.ignoreGhsas entry: the
  # gadget needs attacker-controlled worker options, and the docs build passes
  # only its own. Past the cooldown, so no exclude entry is needed.
  'tinypool@<2.1.2': '>=2.1.2'
  # bestax:review 2026-12-01 — drop once @docusaurus/mdx-loader resolves to
  # >=2.0.3 itself; re-resolve and leave it out if the version is unchanged.
  # Force patched image-size (transitive via @docusaurus/mdx-loader, docs build
  # only) for the two high DoS advisories GHSA-w3rx-r6r6-pgpr and
  # GHSA-5p2g-fcmc-qvqq, which were audit exceptions until 2.0.3 published
  # (2026-09-14). mdx-loader asks for ^2.0.2, so this stays inside its range.
  'image-size@2': '>=2.0.3 <3'
  # bestax:review 2026-12-01 — drop once express@4 admits qs >=6.16.0
  # Force patched qs under the Docusaurus dev server's express@4, which asks for
  # ~6.15.1, for three moderate advisories against >=2.2.5 <6.16.0. Dev-only,
  # never shipped. The copy under the MCP SDK's express@5 already resolves past
  # the floor. Unbounded-lower because the advisory has a single patched floor;
  # capped below 7 so a future major is never forced in.
  'qs@<6.16.0': '>=6.16.0 <7'
  # bestax:review 2026-12-01 — drop once sockjs or webpack-dev-server stops
  # pinning uuid 8
  # Force patched uuid under webpack-dev-server>sockjs (the Docusaurus dev
  # server, dev-only) for a moderate advisory against <11.1.1. sockjs asks for
  # ^8.3.2 and only calls uuid.v4(); 11.x still ships a CommonJS entry with v4,
  # so the require keeps working. Capped at 11.x: 12 and later are the lines to
  # vet separately.
  'uuid@<11.1.1': '>=11.1.1 <12'

# --- Audit exceptions ---

# An advisory with no patched release to force goes here, with a review-date
# marker and why nothing published depends on the package. Remove each entry
# and re-run `pnpm audit --audit-level=high` once its package publishes a fix
# or GitHub withdraws the advisory.
auditConfig:
  ignoreGhsas: []

# Strict, symlinked node_modules prevents phantom dependencies (using packages
# we never declared). Narrow public hoists only for tooling that needs a flat
# layout; expand this list rather than reaching for shamefully-hoist.
nodeLinker: isolated
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
