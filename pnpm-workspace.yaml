packages:
  - bulma-ui
  - docs
  - create-bestax
  - bestax-migrate
  - bestax-mcp
  - eslint-plugin
  - telemetry-worker

# --- Supply-chain hardening ---

# Block-by-default: no dependency here may run install/build lifecycle scripts.
# Every entry is a denial, and #588 retired the last three grants — esbuild,
# @parcel/watcher and unrs-resolver — after showing each one resolves a prebuilt
# platform binary with its script blocked. The list is not redundant with the
# default: each entry records *why* that package's script is unnecessary, so the
# next person to hit `pnpm approve-builds` finds the argument already made. A
# new grant is still possible, and would need a marker (see below); it should
# also have to explain why the platform-binding argument used here does not
# apply to it.
allowBuilds:
  # core-js: its postinstall only prints a funding banner — no build needed.
  core-js: false
  # sass → @parcel/watcher: its `install` script wraps its entire body in
  # `if (process.env.npm_config_build_from_source === 'true')`, which we never
  # set, so the script is a no-op rather than a build. index.js requires the
  # prebuilt @parcel/watcher-<platform> package (13 ship as optionalDependencies)
  # and only falls back to a locally compiled build/Release/watcher.node, which
  # nothing here produces. Grant dropped in #588.
  '@parcel/watcher': false
  # jest-resolve → unrs-resolver: `node postinstall.js` is a three-line delegate
  # to napi-postinstall's generic checkAndPreparePackage, whose only job is
  # fetching a platform binding when none resolved. index.js tries a locally
  # built ./resolver.<platform>.node first and then the prebuilt
  # @unrs/resolver-binding-<platform> package (22 ship as optionalDependencies);
  # we have never produced the former. Grant dropped in #588.
  unrs-resolver: false
  # vite/webpack/storybook/ts-jest → esbuild: `node install.js` does three
  # things, none of them required. It resolves a prebuilt @esbuild/<platform>
  # package (26 ship as optionalDependencies), renames that binary over the JS
  # shim at bin/esbuild — a process-startup optimisation, not correctness, since
  # lib/main.js resolves the platform package at runtime either way — and runs
  # the binary once to check its version. Its remaining paths are fallbacks for
  # when no platform package matched: downloadDirectlyFromNPM() fetches a
  # tarball over HTTPS and installUsingNPM() shells out to npm. An install-time
  # script that can reach the network is the thing this list exists to stop, so
  # the grant was costing more than the startup it saved. Grant dropped in #588.
  esbuild: false
  # wrangler (CI-only Cloudflare Pages deploy) pulls these native builds; the
  # `pages deploy` static upload doesn't need them, so keep them blocked.
  sharp: false
  workerd: false
  # @storybook/test-runner → @swc/jest → @swc/core: its postinstall is only a
  # fallback native build; the platform binary ships as an optional dependency
  # (@swc/core-darwin-arm64 etc.), so no script needs to run.
  '@swc/core': false

# Every entry in this file's four bypass lists — allowBuilds above, plus
# overrides, the cooldown exclusions, and auditConfig.ignoreGhsas — must carry
# one of these markers in the comment directly above it —
# `check:conformance --only=bypass-expiry` fails the build without one, and
# again once a review date arrives (#391):
#
#   # bestax:review YYYY-MM-DD — why this date
#   # bestax:permanent — why this is not debt
#
# The date is a review-by, not a deadline: when it lands, re-check whether the
# entry still earns its place, then drop it or push the date out with a reason.
# CONTRIBUTING.md has the runbook for adding one during a live advisory.
#
# allowBuilds is the exception to "every entry": only `pkg: true` needs a
# marker. A `pkg: false` entry restates the block-by-default rule rather than
# weakening it, so the gate leaves denials alone — a marker demanded for one
# would be noise, and reflexive markers are worth less than none.
#
# The entries below deliberately share ONE sweep date rather than staggered
# ones. Staggering would spread the same work over more red-gate events, and
# it would be false precision: we cannot predict which parent widens its range
# first, so per-entry dates would be guesses dressed as schedule. One date means
# one sweep, one PR, and (via grouped reporting) one violation rather than
# fourteen. The cost is that the sweep day lands on whoever pushes next — the
# same "unrelated PR goes red" problem #391 is about, which only the deferred
# option C removes. Push the whole batch out together when you sweep.

# Dependency cooldown: refuse to install versions published less than 3 days
# ago (defends against just-published malicious releases, which are usually
# yanked within hours). Add packages to the exclude list for urgent patches.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # bestax:permanent — not a bypass to prune: this formatter's output must be
  # deterministic, so we track the exact version the code is formatted with
  # rather than lag it behind the cooldown (which would cause recurring
  # reformat churn). Dev-only, never shipped to users.
  - prettier

# Pin a single prettier version workspace-wide so eslint-plugin-prettier and
# `prettier --check` never disagree (patch versions format union types
# differently, which otherwise splits into two resolved copies).
overrides:
  # bestax:permanent — a deliberate single-version pin for formatting
  # determinism, not an advisory patch waiting on the ecosystem.
  prettier: 3.9.9
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores
  # once Storybook's test runner works with jest 30.5
  # (storybookjs/storybook#36116). This date is those ignores' review too.
  # Hold the jest family on 30.4. jest 30.5 makes module.register() throw
  # inside the test sandbox, and Storybook's importModule calls it the first
  # time it loads a file, so test-storybook:ci fails before it runs a story.
  # The manifests' ^30 ranges admit 30.5, so a hold kept only in the lockfile
  # lasts until the next Dependabot group re-locks it. Each entry caps one jest
  # package that something in the tree asks for by range. A jest package that
  # still resolves to 30.5 without the lockfile needs an entry of its own.
  # Each value is the exact version the lockfile holds, not a range: jest's
  # packages pin one another exactly, and an override rewrites those pins too,
  # so a range here would let a fresh resolve mix patch releases. With exact
  # values the pins stay exact, and the family members nothing asks for by
  # range follow them. Each selector matches only the 30.x releases before
  # 30.5, so a request for ^30.5.0, such as the Storybook release that fixes
  # the issue above, is left alone, and so is a move to 31. A workspace
  # manifest bumped to ^30.5 would be left alone too, and would mix 30.5 into
  # a tree whose test runner stays on 30.4, so .github/dependabot.yml ignores
  # 30.5 for the jest packages the manifests name, which keeps the Dependabot
  # group from proposing it while this hold stands. The entries hold one
  # version line between them, so drop them together.
  'jest@>=30.0.0 <30.5': '30.4.2'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, bulma-ui's test environment
  'jest-environment-jsdom@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, the packages' test globals
  '@jest/globals@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, @storybook/test-runner's copy
  'jest-circus@>=30.0.0 <30.5': '30.4.2'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, @storybook/test-runner's copy
  'jest-runner@>=30.0.0 <30.5': '30.4.2'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, @storybook/test-runner's copy
  'jest-environment-node@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, @storybook/test-runner's copy
  '@jest/types@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, via jest-watch-typeahead
  'jest-watcher@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, via jest-watch-typeahead
  'jest-regex-util@>=30.0.0 <30.5': '30.4.0'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, via @swc/jest
  '@jest/create-cache-key-function@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, via @types/jest
  'expect@>=30.0.0 <30.5': '30.4.1'
  # bestax:review 2026-11-13 - drop with .github/dependabot.yml's jest ignores;
  # jest 30.4 hold, via @types/jest
  'pretty-format@>=30.0.0 <30.5': '30.4.1'
  # The entries below force patched versions of transitive dependencies. Each
  # stops being load-bearing once its parents widen their own ranges, so prune
  # periodically: drop an entry, re-resolve, and leave it out if the resolved
  # version is unchanged and `pnpm audit --audit-level=high` stays clean.
  # Every entry below carries its own marker; this prose annotates nothing.
  # bestax:review 2026-11-13 — quarterly sweep
  # Force the patched serialize-javascript (transitive via Docusaurus webpack
  # plugins) — <=7.0.2 has an RCE advisory (GHSA-5c6j-r48x-rmvq).
  serialize-javascript: '>=7.0.3'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched sharp (transitive via wrangler>miniflare, CI-only deploy
  # tooling with its native build blocked above) — high libvips CVEs. Floor
  # raised to 0.35.4 for GHSA-rgj7-g3m4-5g8c, which widened the affected range
  # past the previous force and reddened every open PR until this moved.
  # Raised again to 0.35.5 for GHSA-wq5f-xc86-pv6w (librsvg). 0.35.5
  # (2026-09-27) is past the cooldown, so no exclude entry is needed.
  'sharp@<0.35.5': '>=0.35.5'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched postcss (transitive via vite/storybook and the Docusaurus
  # webpack CSS pipeline) — high advisory GHSA-r28c-9q8g-f849: sourceMappingURL
  # auto-loading follows `../` out of the source directory and discloses
  # arbitrary .map files. Floor raised to 8.5.23 for GHSA-fxqj-rqcc-2cmp, the
  # moderate follow-up to GHSA-6g55-p6wh-862q whose fix was incomplete.
  # Selector widened from `postcss@<8.5.18` to the whole 8.x major on purpose:
  # the tree had already floated to 8.5.21, so the old `<8.5.18` selector
  # matched nothing and the entry had quietly stopped being load-bearing. A
  # version-bounded selector expires itself the moment the ecosystem passes it.
  'postcss@8': '>=8.5.23 <9'
  # bestax:review 2026-12-01 — drop once the jest/babel chain resolves to
  # >=4.28.7 itself; re-resolve and leave it out if the version is unchanged.
  # Force patched browserslist (transitive via ts-jest>jest>@babel/core and the
  # Docusaurus/vite build chains — 100 paths, nothing declares it directly).
  # Two high advisories, both fixed in the same release: GHSA-c83g-rgw3-j3cx
  # and GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via an untrusted
  # browserslist-stats.json in normalizeStats). One patched floor covers the
  # whole 4.x line, so this uses the unbounded-lower selector the runbook
  # prescribes for that case rather than pinning whichever major the lockfile
  # holds today.
  'browserslist@<4.28.7': '>=4.28.7'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched brace-expansion per major for its advisories, which ship
  # per-major backports. Each floor is the newest fix on its line, including
  # the moderate ones the audit gate doesn't see.
  # Do NOT collapse this into an unscoped cross-major force: brace-expansion
  # 5.x's CommonJS entry exports a named `expand` and the module value itself
  # is not callable, so minimatch@3 (`const expand = require('brace-expansion')`)
  # throws on any brace pattern when handed 5.x. 4.x has no in-major patch and
  # no consumer in this tree; if one ever appears the audit gate will flag it,
  # and the cross-major question gets decided then, against that consumer's
  # import style.
  'brace-expansion@1': '>=1.1.21 <2'
  # bestax:review 2026-11-13 — quarterly sweep; 2.x line, prunable on its own
  'brace-expansion@2': '>=2.1.7 <3'
  # bestax:review 2026-11-13 — quarterly sweep; 3.x line, prunable on its own
  'brace-expansion@3': '>=3.0.9 <4'
  # bestax:review 2026-11-13 — quarterly sweep; 5.x line, prunable on its own
  'brace-expansion@5': '>=5.0.12 <6'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched axios under wait-on (create-bestax's dev dependency, and the
  # storybook test runner's jest-process-manager) for its high advisories. The
  # floor is the newest fix on the 1.x line. Both wait-on ranges admit it and
  # it is past the cooldown. Prune once wait-on resolves to >=1.20.0 without
  # the force.
  'axios@1': '>=1.20.0 <2'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched fast-uri under ajv@8 (transitive via commitlint, webpack's
  # schema-utils, the eslint toolchain and the MCP SDK) for its high
  # advisories. The floor is the newest fix on the 3.x line: 3.1.7 patches
  # GHSA-qw65-cvwx-89v3 and GHSA-58mr-gqgx-xq4g. Scoped to the affected 3.x
  # major, since each major gets its own backport. Prune once the ajv chain
  # resolves to >=3.1.7 on its own.
  'fast-uri@3': '>=3.1.7 <4'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched undici 7.x (transitive via semantic-release/github and
  # wrangler>miniflare: release and CI-deploy tooling, never published output)
  # for its high advisories. The floor is the newest fix on the 7.x line:
  # 7.29.1 patches GHSA-rfgv-xxqx-mfg5 and GHSA-w293-vg96-wgc3. Capped at the
  # 7.29 line because wrangler and miniflare pin undici exactly and nothing in
  # CI exercises them before a deploy, so they move by a patch rather than to
  # the newest minor. Prune once their pin reaches >=7.29.1.
  'undici@7': '>=7.29.1 <7.30'
  # bestax:review 2026-11-13 — quarterly sweep
  # The 6.x copy (under @actions/http-client), held to the newest fix on its
  # line: 6.28.1 patches the high GHSA-rfgv-xxqx-mfg5. Keep this floor at the
  # newest fix even when only moderate advisories move it. Those never trip
  # `pnpm audit --audit-level=high`, which is why three of them sat here
  # unnoticed until the OpenSSF Scorecard run counted them (#404). Prune once
  # @actions/http-client requires >=6.28.1 itself.
  'undici@6': '>=6.28.1 <7'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched joi per major for high advisory GHSA-6h2x-m376-mqjq
  # (quadratic backtracking in `Joi.string().isoDate()`). The 17.x copy rides
  # the Docusaurus types and the storybook test runner's wait-on; the 18.x copy
  # is create-bestax's wait-on, a dev dependency. Both patched releases are
  # past the cooldown and every parent range admits them; the lockfile just
  # predates them. Prune each entry once its line resolves to >=17.13.7 /
  # >=18.2.6 without the force.
  'joi@17': '>=17.13.7 <18'
  # bestax:review 2026-11-13 — quarterly sweep; 18.x line, prunable on its own
  'joi@18': '>=18.2.6 <19'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched minimatch/yaml under docusaurus-plugin-llms. From 0.5.0 that
  # plugin pins its own dependencies exactly ("minimatch": "9.0.3" rather than
  # "^9.0.3"), so the range no longer floats to a patched release the way it did
  # on 0.4.x. 9.0.3 carries three high ReDoS advisories — GHSA-3ppc-4f35-3m26,
  # GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74 — and the pinned yaml 2.8.1 carries
  # GHSA-48c2-rrv3-qjmp (stack overflow on deeply nested collections). Scoped to
  # the affected major so the minimatch 10.x already in the tree is untouched.
  # Prune both once the plugin widens its ranges again.
  'minimatch@9': '>=9.0.7 <10'
  # bestax:review 2026-11-13 — quarterly sweep; same plugin, separate advisory
  'yaml@2': '>=2.8.3'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched js-yaml per major — high advisory GHSA-5p4m-2wfm-xmqj
  # (CVE-2026-59870): quadratic CPU consumption resolving !!omap. The 3.x copy
  # rides the jest coverage chain (babel-plugin-istanbul >
  # @istanbuljs/load-nyc-config); the 4.x copies ride cosmiconfig (commitlint,
  # semantic-release) and the Docusaurus frontmatter pipeline. Both patched
  # releases are already older than the cooldown, and every parent range admits
  # them — the lockfile just predates them. Floors raised for
  # GHSA-2883-xcg3-v3hh, a second high advisory whose ranges reach past the
  # earlier forces; both patched releases (2026-08-26) are past the cooldown
  # too. Prune each entry once its line resolves to >=3.15.2 / >=4.3.2 without
  # the force.
  'js-yaml@3': '>=3.15.2 <4'
  # bestax:review 2026-11-13 — quarterly sweep; 4.x line, prunable on its own
  'js-yaml@4': '>=4.3.2 <5'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched nanoid under the vite>postcss chain (storybook build
  # tooling) — high advisory GHSA-2v37-7h3g-55p8: custom generators can loop
  # indefinitely when size is zero. The advisory's affected range was widened
  # from <3.3.17 to <3.3.18 after 3.3.17 shipped an incomplete fix, so the
  # earlier force stopped clearing the gate and every open PR went red on it.
  # 3.3.18 (2026-08-07) is well past the cooldown and postcss's ^3.3.16 admits
  # it, so no minimumReleaseAgeExclude entry is needed. Scoped to the 3.x major
  # (the only copy in the tree; the 4.x/5.x line has its own patch at 5.1.6 if
  # a consumer ever appears). Prune once the chain resolves to >=3.3.18 without
  # the force.
  'nanoid@3': '>=3.3.18 <4'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched svgo under the Docusaurus CSS pipeline
  # (cssnano>cssnano-preset-default>postcss-svgo>svgo, and @svgr/plugin-svgo)
  # — high advisory GHSA-w27v-7q3p-w38r against >=3.0.0 <3.3.5. 3.3.5 is well
  # past the cooldown and the parents' ^3 ranges admit it, so no
  # minimumReleaseAgeExclude entry is needed. Scoped to the 3.x major: the
  # advisory's range is 3.x only, and the 4.x line is unaffected if a consumer
  # ever appears. Prune once the chain resolves to >=3.3.5 without the force.
  'svgo@3': '>=3.3.5 <4'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched body-parser 1.x (transitive via the Docusaurus dev server's
  # express@4 chain) — GHSA-v422-hmwv-36x6, a low-severity DoS when an invalid
  # `limit` is supplied. Scoped to the 1.x major: the 2.3.0 copy already in the
  # tree carries the fix. Prune once express@4's range admits >=1.20.6.
  'body-parser@1': '>=1.20.6 <2'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched webpack-dev-server (the Docusaurus dev server; dev-only,
  # never shipped) — GHSA-f5vj-f2hx-8m93 (CSRF) and GHSA-m28w-2pqf-7qgj (DoS
  # via a malformed request), both fixed in 5.2.6. Scoped to the 5.x major like
  # every other entry here. An unscoped key would also capture a parent that
  # legitimately moves to 6.x and force it back onto the 5 line, which is a
  # downgrade wearing a patch's clothing; the `<6` right-hand bound only ever
  # protected consumers already on 5.x, and it cannot express "do not upgrade".
  # Prune once Docusaurus requires >=5.2.6 itself.
  'webpack-dev-server@5': '>=5.2.6 <6'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched proxy-addr (transitive via bestax-mcp>@modelcontextprotocol/sdk
  # >express) for the critical IP spoofing advisory GHSA-jqcg-44mw-7w3h, fixed in
  # 2.0.8. express asks for ~2.0.7, so this stays inside its range. 2.0.8 is past
  # the cooldown, so no exclude entry is needed. Prune once express resolves to
  # >=2.0.8 without the force.
  'proxy-addr@<2.0.8': '>=2.0.8'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched tinypool (transitive via @docusaurus/core) for the critical
  # prototype pollution advisories GHSA-5gmw-xhrv-c9v3 and the run() follow-up,
  # fixed in 2.1.2. Docusaurus asks for the 1.x line, so this crosses a major
  # inside the docs build. The docs build in CI is the check that it still works.
  # If it breaks, replace this with a dated auditConfig.ignoreGhsas entry: the
  # gadget needs attacker-controlled worker options, and the docs build passes
  # only its own. Past the cooldown, so no exclude entry is needed.
  'tinypool@<2.1.2': '>=2.1.2'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched source-map-js (transitive via vite and Docusaurus >postcss) for
  # the high advisory GHSA-68fv-2mgg-jv7q, fixed in 1.2.2 on the 1.x line that
  # postcss asks for. Past the cooldown. Prune once postcss resolves to >=1.2.2.
  'source-map-js@<1.2.2': '>=1.2.2'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched compression (transitive via the Docusaurus dev server's
  # webpack-dev-server, dev-only, never shipped) for the high advisory
  # GHSA-vc2v-76pw-4v95, fixed in 1.8.2. Past the cooldown. Prune once
  # webpack-dev-server resolves to >=1.8.2 without the force.
  'compression@<1.8.2': '>=1.8.2'
  # bestax:review 2026-11-13 — quarterly sweep
  # Force patched shell-quote (transitive via the Docusaurus dev server's
  # webpack-dev-server>launch-editor, dev-only, never shipped) for the critical
  # advisory GHSA-pqg4-j6r4-53mv, fixed in 1.11.0. Past the cooldown. Prune
  # once launch-editor resolves to >=1.11.0 without the force.
  'shell-quote@<1.11.0': '>=1.11.0'

# --- Audit exceptions (no patched release exists) ---

# image-size <=2.0.2 carries two high DoS advisories (infinite loops in the
# ICNS, JXL, and HEIF parsers): GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq.
# GitHub lists no patched release for either (`first_patched_version: null`;
# the ">=2.0.3" in audit output is unpublished) and npm's latest is still
# 2.0.2, so there is no version an override could force. Exposure is confined
# to the docs build: Docusaurus's mdx-loader sizes images from this repo's own
# tree, never untrusted input. Remove both entries and re-run
# `pnpm audit --audit-level=high` once a patched image-size publishes and the
# Docusaurus chain resolves to it.
#
# braces <=3.0.3 carries a high stack-exhaustion DoS through deeply nested
# patterns (GHSA-vfj7-8cjw-p6xm), and http-cache-semantics <=4.2.0 a high
# advisory where max-stale handling can serve one user's cached response to
# another (GHSA-ch52-4w7c-c8xp). GitHub lists no patched release for either,
# so again there is nothing to force. No published package depends on either.
# braces arrives through glob tooling (micromatch, chokidar and fast-glob,
# under semantic-release and Docusaurus), which only ever expands patterns
# written in this repo. http-cache-semantics arrives through Docusaurus's update-notifier,
# a version check with one user and no shared cache. Remove each entry and
# re-run `pnpm audit --audit-level=high` once its package publishes a fix.
auditConfig:
  ignoreGhsas:
    # bestax:review 2026-11-13 — quarterly sweep. The review is "has image-size
    # published a fix yet", not "can we drop this".
    - GHSA-w3rx-r6r6-pgpr
    # bestax:review 2026-11-13 — quarterly sweep; second image-size advisory
    - GHSA-5p2g-fcmc-qvqq
    # bestax:review 2026-11-13 — quarterly sweep; has braces published a fix
    - GHSA-vfj7-8cjw-p6xm
    # bestax:review 2026-11-13 — quarterly sweep; has http-cache-semantics
    # published a fix
    - GHSA-ch52-4w7c-c8xp

